[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy>=2.0.54",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.32",
    "pymysql>=1.2.3",
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "python-dateutil>=2.8.2",
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "apscheduler>=3.10.4",
    "alembic>=1.20.0",
    "tushare>=1.4.29",
    "akshare>=1.18.96",
    "lxml>=6.1.3",
    "simplejson>=4.1.2",
    "click>=8.5.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
    # 增量覆盖率门禁（issue #464）；安装来源仍是 requirements.txt，此处仅登记
    "diff-cover>=10.5.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# pytest 配置收纳（issue #172）：此前 --strict-markers 依赖 CI 命令行传递，
# 本地裸跑 pytest 无此保护。自定义 marker 必须在此登记（--strict-markers），
# unit/integration/e2e 由 conftest 按目录自动打标（issue #469），
# dialect 由 MySQL-only 用例显式声明；登记后可用 `pytest -m ...` 选择子集。
[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: 单元测试（tests/unit，按目录自动打标）",
    "integration: 集成测试（tests/integration，按目录自动打标）",
    "e2e: 端到端业务流程测试（tests/e2e，按目录自动打标）",
    "slow: 明显慢于同层中位数的用例（暂未启用，登记备用）",
    "dialect: 仅在 MySQL 方言下有效（SQLite 下 skip）的用例，由用例显式声明",
]

# 覆盖率设防（issue #254；#171 观察期结束转入设防期）：
# 配置放 [tool.coverage.*] 而非 pytest addopts——不传 --cov 时 coverage 完全不激活，
# 本地跑子集零开销；CI（backend-test job）带 --cov 即自动启用分支口径 + 硬阈值。
# fail_under 为 branch-inclusive 的合并口径（stmts 与 branches 一起算，即 coverage.py 的
# TOTAL），本文件是该数值的单一事实来源（#621 之前它同时硬编码在 backend/AGENTS.md 三处
# 与 ci.yml 一处，改一次要动 4 个文件）。
# 历次上调：80（2026-08-29 实测 80.81%，#254/#320）→ 81（2026-09-08 实测 81.42%，#404）
# → 82（2026-09-08 实测 82.15%，#405 审计埋点，#416）→ 86（2026-09-24 补 #621 缺口）。
# 86 的来历：82 自 #416 起 94 个 merge 未动，main 实测已到 87.06%（CI，e882912）/ 87.12%
# （本地全量重跑），至少 4 次触发点（84/85/86/87）被跳过，缺口 5.06pp ≈ 458 units——
# 删/skip 掉这个量级的测试 CI 仍全绿（增量门禁只看 app/ 改动行，删测试不产生改动行）。
# 目标值口径为 floor(main 实测 − 1pp) 而非 floor(实测)：9050 units 下 1pp = 90 units，
# 而同一 commit 两次运行的噪声就有 5 units（CI 87.06 / 本地 87.12）；按 floor(实测) 定 87
# 只余 0.06pp，base 漂移容忍 ≈5 小时（近期涨速 0.27pp/天），且新代码按增量门禁最低档 80%
# 覆盖时加 ~79 units 就会让全局门禁红。留 1pp 后：余量 1.06pp、漂移容忍 ≈4 天。
# 棘轮触发口径（谁该动、实测取哪一次运行）见 backend/AGENTS.md「跑测试」节。
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 86
show_missing = true
