[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0.52",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.32",
    "pymysql>=1.2.0",
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "python-dateutil>=2.8.2",
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "apscheduler>=3.10.4",
    "alembic>=1.19.2",
    "tushare>=1.4.29",
    "akshare>=1.18.94",
    "lxml>=6.1.3",
    "simplejson>=4.1.2",
    "click>=8.5.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# pytest 配置收纳（issue #172）：此前 --strict-markers 依赖 CI 命令行传递，
# 本地裸跑 pytest 无此保护。当前无自定义 marker（仅内建 parametrize），
# 新增自定义 marker 时须在此登记，否则 --strict-markers 会拒绝运行。
[tool.pytest.ini_options]
addopts = "--strict-markers"

# 覆盖率设防（issue #254；#171 观察期结束转入设防期）：
# 配置放 [tool.coverage.*] 而非 pytest addopts——不传 --cov 时 coverage 完全不激活，
# 本地跑子集零开销；CI（backend-test job）带 --cov 即自动启用分支口径 + 硬阈值。
# fail_under 为 branch-inclusive 口径：2026-09-08 实测基线 82.15%（#405 审计埋点），下取整定 82。
# 棘轮规则（只升不降、上调时机）见 backend/AGENTS.md「跑测试」节。
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 82
show_missing = true
