# ============================================================================
# InvestRing 开发环境 Docker Compose 配置
# ============================================================================
# 使用方式：docker compose -f docker-compose.dev.yml up -d
# 特点：挂载源码目录支持热重载，包含 MySQL 数据库
#
# 轮转（issue #407）：三个服务均配 json-file + 10m×3，取值与生产
# docker-compose.yml 逐字一致——此前 dev 侧完全没有 logging 段，容器日志无上限增长。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # MySQL 数据库（开发环境必备）
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: investring-dev-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: dev_password
      MYSQL_DATABASE: investring_dev
    volumes:
      - mysql-dev-data:/var/lib/mysql
    networks:
      - investring-dev-net
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # 后端服务：开发模式（热重载）
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: investring-dev-backend
    ports:
      - "8000:8000"
    volumes:
      # 挂载源码目录，实现代码热重载
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=dev_password
      - DB_NAME=investring_dev
      - SECRET_KEY=dev-secret-key
      - DEBUG=True
    networks:
      - investring-dev-net
    depends_on:
      - mysql
    # 开发模式使用单 worker + reload
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # 前端服务：开发模式（热重载）
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: deps  # 只构建到依赖安装阶段
    container_name: investring-dev-frontend
    ports:
      - "3000:3000"
    volumes:
      # 挂载源码实现 HMR
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
    environment:
      - NODE_ENV=development
    networks:
      - investring-dev-net
    depends_on:
      - backend
    # 开发模式使用 next dev
    command: npm run dev -- -H 0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-dev-data:

networks:
  investring-dev-net:
    driver: bridge
