[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investring-cli"
version = "0.2.0"
description = "InvestRing lightweight HTTP client CLI"
requires-python = ">=3.10"
dependencies = ["typer>=0.9.0", "httpx>=0.27.0"]

[project.scripts]
ir = "ir_cli.main:app"

[tool.setuptools.packages.find]
include = ["ir_cli*"]
