# Dependabot 版本更新（#252 / #608）：常规升级改为月度分组，减少零散 PR。
# 与 Security Scan（security-scan.yml）互补：告警发现漏洞，这里提升级 PR。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      backend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      vitest-suite:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/coverage-v8"]
      frontend-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["vitest", "@vitest/coverage-v8"]
        update-types: ["minor", "patch"]
    ignore:
      # TS 7 为 Go 原生编译器（tsgo），typescript-eslint / eslint-config-next 尚不支持，
      # 升级后 Frontend Lint & Build 必挂（见 PR #265 评估）。升 TS 7 需等工具链支持后
      # 走 feature 分支 + issue 评估；届时移除本忽略规则。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Next 15 → 16 为 major 框架升级（middleware 等潜在破坏点），走 issue #292 评估；
      # 完成升级后移除本规则。
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # 类型定义须与运行时 Node 24 对齐，升 26 随运行时升级一并处理。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # recharts 3.x 收紧 Tooltip formatter 类型，升级需代码适配（issue #291）；
      # 适配完成后移除本规则。
      - dependency-name: "recharts"
        update-types: ["version-update:semver-major"]
      # eslint 10 尚未被 eslint-config-next@15.x 接受（peer 要求 ^7.23.0 || ^8.0.0 || ^9.0.0），
      # 升级后 npm ci 直接 ERESOLVE 失败（见 PR #294 评估）。等 eslint-config-next 支持 10.x
      # 后移除本规则。
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
