# ============================================================================
# E2E 栈 reusable workflow（issue #467）
# ============================================================================
# `frontend-e2e` 与 `e2e-compare-capture` 的栈步骤原本逐行同构（MySQL service /
# 建库 / 迁移 / 种子 / uvicorn / 前端生产构建与 standalone 组装 / 浏览器缓存与安装），
# 双份维护必然漂移。抽成本 workflow 后两侧差异只剩显式入参。
#
# 两种模式：
#   - main    ：全量 E2E 门禁（retries 由调用方给 2，容错偶发抖动），产出 html 报告
#               与 flaky 汇总用的 JSON；失败证据 + 后端日志进单一 artifact。
#   - capture ：E2E 形态对比采集（retries=0 保形态真实、workers=2、trace 只留失败样本
#               供抖动取证、JSON 落文件供 scripts/e2e_normalize.py 归一化）；baseline
#               侧只换 frontend/e2e 目录。
#               **只在形态触发时被实跑**（命中 frontend/e2e、playwright 配置、种子、
#               normalizer、scripts/tests 时）——只改本文件不会触发它，改 capture 分支
#               请手动确认一次形态 PR 的 CI（#467 评审登记）。
#
# ⚠️ GitHub 硬约束（改本文件前必读）：
#   1. 调用方 `uses:` job 上只能写 name/uses/with/secrets/strategy/needs/if/
#      concurrency/permissions/cache-mode——`timeout-minutes`、`services`、`env`
#      **必须留在本文件内**（故下面不搬走）；caller 的 workflow 级 env 也不传播。
#   2. called workflow 读不到 caller 的 matrix——capture 的 side 必须经 `with` 传入。
#   3. artifact 名必须由调用方参数化：同一 workflow run 内 artifact 重名 = 上传硬失败。
#   4. `github.*` 上下文是 caller 的（故 baseline 换目录可直接读 pull_request.base.sha）。
#
# 不变量（勿改，均来自 #401/#410/#414）：
#   - baseline 侧**只换 frontend/e2e/**，两侧构建源同为 PR head（测试重构 + src 补
#     data-testid 的 PR 仍可比对）；
#   - capture 的 raw JSON artifact 是 normalizer 的必需输入 → `if-no-files-found: error`；
#   - 其余诊断品 artifact 一律 `if: always()` + `continue-on-error`（#414：上传失败不染红）。
#
# 上面这些不变量、以及 artifact 前缀在本文件与 ci.yml 之间的多处耦合，现由
# scripts/tests/test_ci_e2e_compare.py 守门（#490）：capture 运行步的 --workers=2
# 与 --trace retain-on-failure（#958 证据缺口）、
# swap 步的 mode+side 双条件、分叉点检出与 $FORK_SHA 引号（空值不引号 = baseline 静默等同
# candidate → 恒空 diff 且全绿）、`if-no-files-found: error` 只许挂在 raw JSON 上。
# 改这些位置会同步红，不必等一次形态 PR。仍然手动确认的只有 capture 的 runtime 面
# （见上第 2 条与本文件头部既有登记）。
# ============================================================================

name: E2E Stack

on:
  workflow_call:
    inputs:
      mode:
        description: "main（全量门禁）或 capture（形态对比采集）"
        required: true
        type: string
      side:
        description: "capture 用：candidate / baseline（baseline 换 frontend/e2e 目录）"
        required: false
        type: string
        default: candidate
      artifact_prefix:
        description: "artifact 名前缀（main=playwright-report，capture=e2e-raw-<side>）"
        required: true
        type: string
      retries:
        description: "Playwright --retries（main=2 容错、capture=0 保形态真实）"
        required: true
        type: string
      log_file:
        description: "后端启动日志落盘名（进失败证据 artifact）"
        required: true
        type: string

# 与 ci.yml 顶层同口径；caller 的 env 不传播，故在此重复声明
env:
  SECRET_KEY: test-secret-key-for-ci
  SCHEDULER_ENABLED: "false"
  DEBUG: "false"

jobs:
  e2e:
    name: "E2E Stack"
    # ubuntu-latest 已滚到 26.04（ICU 78），而 Playwright webkit-2359 的 MiniBrowser 依赖
    # libicudata.so.74，mobile 用例在启动阶段即 1-3ms 全红。先固定 24.04；待 Playwright
    # 升级到兼容 ICU 78 的 webkit 构建后再放宽。
    runs-on: ubuntu-24.04
    # 预算兜底（#913，与 install 步骤护栏成对放宽）：实测最坏 = 安装 21m52s + 测试 16m19s
    # + 其余约 4m ≈ 42m11s（五轮表见 #913）。45 分钟贴边、50 才有裕量。三次事故里两次先撞
    # install 步骤的 15 分钟护栏、一次撞 job 30 分钟预算，故只调 job 没用，必须与下面两步
    # 15→25 成对改。单独放宽不算治本——治本是下面显式固定 apt 源；这里只保证慢镜像时不再被掐。
    timeout-minutes: 50

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ref 按模式区分（#467 评审）：
      #   capture —— 必须检 PR head：baseline 侧要 checkout 分叉点（merge-base）的 frontend/e2e，
      #              且「两侧构建源同为 PR head」是不变量（#401）；
      #   main    —— 回落 github.sha（即默认 ref：PR 事件 = merge commit、push 事件 =
      #              head commit），保持抽栈前的语义：PR 绿 ⇒ 与当时 base 合并后可绿。
      #              抽栈时曾统一为 head，等于让 frontend-e2e 少验证「head+base 组合」，
      #              故按模式拆回。
      # fetch-depth 0：baseline 侧要 checkout 分叉点（merge-base）的 frontend/e2e。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.mode == 'capture' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # baseline 侧只换 e2e 目录，构建源仍是 PR head——「同一构建、唯一变量是
      # frontend/e2e/**」不变量（#401 场景：测试重构 + src 补 data-testid 依赖这一点）。
      # 对照基准取 base 与 head 的**分叉点**，不是 pull_request.base.sha（#827）：分支
      # 落后时 base 侧会含 head 没有的用例，拿它撞 head 的旧 src 只会得到「head 缺实现」
      # 的假回归；分叉点则保证两侧 e2e 同源可比。
      # 先 rm -rf 再 checkout：head 独有 spec 会残留跑成并集（旧脚本 SWAP_ORPHANS
      # 同源坑）；e2e/.auth/admin.json 是 gitignore 的、由 setup project 重建，删了无妨。
      # **引号是承重的（#490）**：SHA 展开为空时，不引号就退化成
      # `git checkout -- frontend/e2e`——从 index 恢复 head 版本，baseline 与 candidate
      # 同树 ⇒ 恒空 diff ⇒ 形态门禁静默失效且全绿。带引号则 git 收到空参数当场失败，
      # 坏法从 fail-open 翻成 fail-closed（同一位置由 test_ci_e2e_compare.py 钉住）。
      - name: Swap e2e to base (baseline only)
        if: inputs.mode == 'capture' && inputs.side == 'baseline'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rm -rf frontend/e2e
          FORK_SHA="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          if [ "$FORK_SHA" != "$PR_BASE_SHA" ]; then
            echo "::notice::PR 分支落后 base（base=$PR_BASE_SHA head=$PR_HEAD_SHA fork=$FORK_SHA），baseline e2e 按分叉点检出（#827）"
          fi
          git checkout "$FORK_SHA" -- frontend/e2e

      # ---- 后端：建库 → bootstrap prepare → seed → 启动 ----
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级字符集对齐 backend-test-mysql（utf8mb4 / utf8mb4_general_ci，#433 起统一）。
      #
      # 最小权限 E2E 账号（#548，口径同 ci.yml 的 backend-test-mysql / #539）：下面三个连接串
      # （建 schema / 种子 / Start backend）一律用**与库同名**的 ir_e2e，root 只留在本步建库
      # 建号。口令与用户名同值——这是每次 run 新建、只对 runner 回环暴露的一次性服务容器，
      # 不构成秘密（root 口令本就写在本 job 的 service 定义里）。权限清单以
      # scripts/tests/test_ci_mysql_account.py 的 REQUIRED_PRIVILEGES 为准，逐条对应本 job 的
      # 真实用法：bootstrap prepare 显式执行 create_all + alembic upgrade head，Start backend 不重复 DDL。
      # ALTER 另覆盖迁移 0015 的 ALTER DATABASE，REFERENCES 是建外键时父表上的必需权限。
      # 本 job 没有 drop_all、也没有 downgrade，那份清单对它只是上界——与 backend-test-mysql
      # 共用一份、不分叉，是 #548 的决策（判据抄两份就必然漂移）。
      # 刻意不给：ALL PRIVILEGES、GRANT OPTION（无从转授权）、SUPER、FILE、PROCESS。
      - name: Create database and least-privilege E2E account
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
            CREATE USER 'ir_e2e'@'%' IDENTIFIED BY 'ir_e2e';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES
              ON ir_e2e.* TO 'ir_e2e'@'%';"

      - name: Create schema and run migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://ir_e2e:ir_e2e@127.0.0.1:3306/ir_e2e?charset=utf8mb4
        run: |
          STATE=$(python -m app.bootstrap status | python -c 'import json,sys; print(json.load(sys.stdin)["fingerprint"])')
          python -m app.bootstrap prepare --expect-state "$STATE"
          python -m app.bootstrap check

      # 种子 ADMIN/admin@2026 + draft 组合 E2E_PORT + active 组合 E2E_ACTIVE
      # （E2E 登录与业务 spec 按 code 直达依赖，勿删；种子体与 pytest 同源：
      # backend/tests/seed_base.py，issue #222 / #354）
      - name: Seed E2E base data
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://ir_e2e:ir_e2e@127.0.0.1:3306/ir_e2e?charset=utf8mb4
        run: python scripts/seed_e2e.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://ir_e2e:ir_e2e@127.0.0.1:3306/ir_e2e?charset=utf8mb4
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../${{ inputs.log_file }} 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      # ---- 前端：生产构建 + webServer 由 playwright.config.ts 自动起 standalone server.js（:3000）----
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        # node/npm 版本先落日志作证据（#577 ③）；形态由 scripts/tests/test_lock_registry.py 钉死
        run: |
          node -v && npm -v
          npm ci

      # E2E 跑生产构建形态（issue #171）：standalone server.js 与 Docker
      # 容器完全同形态（next start 与 output:'standalone' 不兼容）；
      # API_BASE_URL 默认 localhost:8000，build 时固化的 rewrites 恰与
      # 本 job 后端地址一致，无需额外传参。
      # standalone 不包含 public/ 与 .next/static/，组装步骤与 Dockerfile 一致。
      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      # 浏览器二进制缓存（issue #172）：key 绑定 package-lock.json
      # （@playwright/test 版本决定所需浏览器构建）。
      # restore-keys 前缀回退（#913）：仅是「防未来 lock 变动引发真 miss」的廉价保险，
      # **不是本次根因修复**——五轮实测浏览器缓存全 Hit，本次慢/挂的根因是 apt 系统依赖
      # 下载落到慢镜像（见下方 Pin apt mirror 步与 #913 五轮表）。lock 里无关依赖变动会让
      # 精确 key 失配，前缀回退可复用上一版缓存、只补下缺失构建，避免那种未来的真 miss。
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # 桌面 chromium + 移动 webkit（mobile 用 iPhone 13 描述符，
      # 见 playwright.config.ts 注释；PR #169 遗留的 webkit 307 取消问题
      # 已定位为 dev 竞态并修复，恢复真实 Safari 内核覆盖）。
      #
      # apt 源固定（#913 治本）：--with-deps 要 apt 拉系统依赖（webkit 约 93.1 MB），
      # 耗时跟着 runner 落到的 region 镜像走——azure 时两步合计 29 秒，落到
      # us-east-2.ec2 只有 69–204 kB/s、单步撞 15 分钟护栏装不完（五轮表见 #913）。
      # 下面 Pin apt mirror 步把源显式固定到实测快的 azure，不再受 region 随机摆布。
      #
      # 预置 apt-get update 保留，但更正旧注释口径：它只治「首选镜像不可达」（让 apt
      # 完成镜像回退），**治不了本次的「可达但慢」**——慢镜像可达、回退条件根本不触发。
      # 故不能指望它解决本次问题，治本靠上面的显式固定源。
      # timeout-minutes 兼作快速失败护栏：缓存命中且镜像快时正常 ≤5 分钟；慢镜像最坏
      # 约 22 分钟量级，护栏放宽到 25 的判据见各 install 步注释（#913）。
      - name: Pin apt mirror to azure (explicit fallback)
        # 仅本 E2E job 的 runner 内生效（各 job 独立 runner，不影响其他作业）。
        # 固定源不可达时显式回退默认源并继续，日志可见回退原因；不用 || true 吞失败。
        run: |
          set -euo pipefail
          MIRROR="http://azure.archive.ubuntu.com/ubuntu/"
          DEB822=/etc/apt/sources.list.d/ubuntu.sources
          LEGACY=/etc/apt/sources.list
          BACKUP="$(mktemp -d)"
          # 备份现有源（存在才备），供回退恢复
          for f in "$DEB822" "$LEGACY"; do
            if [ -f "$f" ]; then sudo cp -a "$f" "$BACKUP/$(basename "$f")"; fi
          done
          # 把 URIs 固定到 azure（deb822 与 legacy 两种格式都覆盖；azure 同样服务 security）
          if [ -f "$DEB822" ]; then
            sudo sed -i -E "s|^URIs:.*|URIs: $MIRROR|" "$DEB822"
          fi
          if [ -f "$LEGACY" ]; then
            sudo sed -i -E "s#https?://[^ ]*\.ubuntu\.com/[^ ]*#$MIRROR#g" "$LEGACY"
          fi
          echo "固定后的 apt 源配置："
          for f in "$DEB822" "$LEGACY"; do
            if [ -f "$f" ]; then echo "--- $f ---"; sudo cat "$f"; fi
          done
          # 探测刷新：成功=固定生效；失败=显式回退默认源（不吞失败，回退原因进日志）
          if sudo apt-get update; then
            echo "::notice::apt 源已固定到 azure.archive.ubuntu.com 并刷新成功"
          else
            rc=$?
            echo "::warning::固定源 azure 不可达（apt-get update rc=$rc），显式回退到 runner 默认源并继续；回退原因：固定源刷新失败"
            for f in "$DEB822" "$LEGACY"; do
              b="$BACKUP/$(basename "$f")"
              if [ -f "$b" ]; then sudo cp -a "$b" "$f"; fi
            done
            echo "已恢复默认 apt 源，交由后续 Update apt index 步骤刷新"
          fi
      - name: Update apt index
        run: sudo apt-get update

      - name: Install Playwright chromium
        working-directory: frontend
        # 步骤护栏 15→25（#913，与 job 30→50 成对）：慢镜像下 chromium 实测最坏 8m03s
        # （68.9 kB/s），webkit 同轮撞 15 分钟护栏；放宽到 25 给慢镜像留裕量，避免先撞步骤
        # 护栏（三次事故两次撞这里）。治本靠上面固定 apt 源，这里只是兜底。
        timeout-minutes: 25
        run: npx playwright install --with-deps chromium

      - name: Install Playwright webkit
        working-directory: frontend
        # 步骤护栏 15→25（#913）：webkit 要 apt 拉约 93.1 MB 系统依赖，慢镜像下实测
        # 15m12s/15m13s 两次撞旧 15 分钟护栏、测试根本没跑；azure 镜像下仅 19s。放宽到 25
        # 兜底，治本靠上面固定 apt 源。判据见 #913 五轮表。
        timeout-minutes: 25
        run: npx playwright install --with-deps webkit

      # main 模式：PLAYWRIGHT_JSON_OUTPUT_FILE 触发 playwright.config.ts 追加 json
      # reporter（#466 flaky 汇总的输入；不改 CLI reporter，避免覆盖 html 的配置）。
      # step id 是给下面 Summarize 用的：它的两档口径以「E2E 这次成没成功」为判据。
      - name: Run Playwright tests (main)
        id: e2e_main
        if: inputs.mode == 'main'
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/e2e-flaky.json
        run: npx playwright test --retries=${{ inputs.retries }}

      # capture 模式：--retries=0 让 flaky 不能被洗成 passed（形态对比失真，见
      # frontend/e2e/AGENTS.md §3）；rc 非 0 不直接失败——用例状态已进 JSON，
      # 由 compare job 的形态 diff 判定。
      #
      # --trace retain-on-failure（#958）：playwright.config.ts 缺省是 on-first-retry，
      # 在 --retries=0 下**永不产出 trace**，mobile 抖动红只能靠截图猜帧间隔；显式加本参数
      # 后失败样本带 trace.zip 落 test-results/，由下方 "Upload failure evidence" 上传
      # （该步 if-no-files-found: warn，采集失败时不叠加红）。只在失败时保留，产物体积可控。
      - name: Run Playwright tests (capture)
        if: inputs.mode == 'capture'
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/e2e-raw-${{ inputs.side }}.json
        run: |
          rc=0
          npx playwright test --retries=${{ inputs.retries }} --workers=2 --trace retain-on-failure --reporter=list,json || rc=$?
          echo "playwright rc=$rc（非 0 = 有用例未通过，状态已进 JSON）"

      # flaky 显性化（#466）：retries 保留（偶发抖动不阻断 PR），但重试转绿的用例
      # 必须可见——汇总数量与清单进 Step Summary，flaky>0 时脚本经 **stderr** 发
      # ::warning::（stdout 已被重定向到 Step Summary，注解走 stderr 才不会被写进报告）。
      #
      # 两档口径（#491，与 ci.yml 的 Assert lcov data source 同构）：E2E 成功 ⇒ 这个
      # 步骤**应该**有 JSON 产物，缺即 json reporter 的 wiring 断了（playwright.config.ts
      # 的 append 分支被删 / 环境变量改名），门禁会从此静默空转 → --require-input 判红；
      # E2E 已经红了 ⇒ 缺产物是它自己的症状，只提示 + warning，不给红 job 加噪声。
      # 注意 outcome 经 env 传入而不是内插进 shell（GitHub 官方建议），且 bash -e 下
      # 不能用 `[ cond ] && VAR=x`（条件为假时该步会以 rc=1 结束）。
      - name: Summarize flaky tests
        if: always() && inputs.mode == 'main'
        env:
          E2E_OUTCOME: ${{ steps.e2e_main.outcome }}
        run: |
          ARGS=""
          if [ "$E2E_OUTCOME" = "success" ]; then
            ARGS="--require-input"
          fi
          python3 scripts/e2e_flaky_summary.py --input /tmp/e2e-flaky.json $ARGS >> "$GITHUB_STEP_SUMMARY"

      # 失败证据（trace/截图/视频）+ 后端启动日志（后端启动失败时的定位证据，
      # issue #172），always 上传保证失败时也能取到
      - name: Upload Playwright report
        if: always() && inputs.mode == 'main'
        continue-on-error: true  # 诊断品上传失败不染红 job（artifact 服务间歇 403，#414）
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ inputs.log_file }}
          retention-days: 14

      # capture 的 raw JSON 是 normalizer 的必需输入 → 缺失必须响亮失败（不加 continue-on-error）
      - name: Upload raw JSON
        if: always() && inputs.mode == 'capture'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}
          path: /tmp/e2e-raw-${{ inputs.side }}.json
          retention-days: 14
          if-no-files-found: error

      - name: Upload failure evidence
        if: always() && inputs.mode == 'capture'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-results
          path: |
            frontend/test-results/
            ${{ inputs.log_file }}
          retention-days: 14
          if-no-files-found: warn
