# ============================================================================
# 逃生阀回收：e2e-morph-expected 标签的周期性巡检（issue #483）
# ============================================================================
# 背景：给 PR 打 e2e-morph-expected 可豁免 E2E 形态 diff 门禁（ci.yml 的 e2e-compare）。
#       标签长期不摘 = 长期免检，故周期性曝光「挂太久」的标签。
#
# 为什么独立 workflow，而不是挂回 ci.yml：
#   ① ci.yml 的 job 权限已收紧到 contents: read，本巡检需要 PR / issues 读权限；
#   ② 给 ci.yml 加 schedule 会让 schedule 事件跑遍全部 job（＝#472 被否的 nightly
#      全量），否则得给每个 job 逐个加 event_name 守卫。
# 与 #472（nightly 全量）无关：不跑测试、不跑 E2E、不参与 required check；
# deploy.yml 只订阅 workflows: ["CI"]，不产生任何部署噪音。决策记录见 #483。
#
# 为什么检出即红（#498 起）：warning 注解与 Step Summary 都是 pull-only，而绿 run 的通知
#   本身不带信号（官方文档：启用 Actions 通知后「任何你触发的 run 完成」即通知，含成功，
#   可自设为「仅失败」；定时 workflow 的通知发给最初创建它的用户）——只有失败态才天然表示
#   「需要人看一眼」，且在「仅失败」偏好下唯一有效。
#
# 变红的三种含义，都需人处理：
#   ① 查询链路坏了（令牌/权限/网络/标签被删，或巡检脚本自身异常）——均有 ::error:: 说明；
#   ② 真的检出长期残留；
#   ③ 打标时间取不到而回退（口径退化，可能漏检）——同样必须可见，否则「巡检自己退化」
#      会被读成「无残留」。
#
# 口径：以 PR timeline 的 labeled 事件时间为准（标签摘下再加会重新计时）；取不到时回退
#       PR createdAt，在输出里显式标注为「回退：PR 创建于」，并计入上文 ③。
#       原实现（PR #475 commit d88abd0 删除的 nightly-hygiene job）直接用 createdAt。
# ============================================================================

name: Label Hygiene

on:
  schedule:
    # 每周一 09:00 UTC（错开 security-scan 的 08:00）
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "标签挂载满几天算残留（默认 14；调低可验证告警渲染）"
        required: false
        default: "14"

permissions:
  contents: read
  pull-requests: read   # 开放 PR 清单与 PR timeline
  issues: read          # labels 端点

jobs:
  stale-label-scan:
    name: "Scan stale e2e-morph-expected labels"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 用 github.event.inputs（schedule 事件下无此键 ⇒ 空串），默认值在脚本里兜底，
      # 于是同一份脚本可在本地以 `GITHUB_REPOSITORY=… bash <脚本>` 原样彩排
      # （告警分支另需 GITHUB_STEP_SUMMARY 指向一个可写文件）。
      THRESHOLD_DAYS_INPUT: ${{ github.event.inputs.threshold_days }}
    steps:
      - name: Scan open PRs holding the label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 裸红也要能被识别成「机制坏了」而非「检出」：三处刻意的失败出口都自带 ::error::，
          # 意外异常则由本 trap 补一条说明（行号在上一行日志里）
          trap 'echo "::error::巡检自身异常（非检出）：见上方日志"' ERR
          THRESHOLD_DAYS="${THRESHOLD_DAYS_INPUT:-14}"
          case "$THRESHOLD_DAYS" in
            ''|*[!0-9]*)
              echo "::error::threshold_days 必须是非负整数，实得 '$THRESHOLD_DAYS'"
              exit 1
              ;;
          esac
          # 正向控制：标签若被改名/删除，本巡检会退化成永久空转且仍然报「无残留」（覆盖
          # 无声蒸发）。探一次标签本身，拿不到即红——同时兼作仓库/令牌可达性的主动校验。
          if ! gh api "repos/$GITHUB_REPOSITORY/labels/e2e-morph-expected" --jq .name > /dev/null; then
            echo "::error::标签 e2e-morph-expected 取不到（被改名/删除、仓库不可达或权限不足？）：本巡检已失效，请核实后同步本 workflow 或撤下"
            exit 1
          fi
          list=/tmp/labeled-prs.tsv
          # 用 REST issues 端点而非 `gh pr list --label`：后者走 search API，实测仓库
          # 无法解析时**静默 exit 0 + 空结果**（gh 2.96），会被读成「没有残留」——静默
          # 假绿。REST 侧 404/401/限流均非零退出，配合 set -e 直接让本 workflow 红。
          # --paginate 逐页取全，不存在 `gh pr list --limit N` 式的静默截断。
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=open&labels=e2e-morph-expected&per_page=100" \
            --jq '.[] | select(.pull_request) | [.number, .title, .created_at] | @tsv' > "$list"

          scanned=0
          hit=0
          fallback=0
          hit_nums=""
          stale=""
          # 尾行兜底 `|| [ -n "$n" ]`：输入最后一行若缺换行，read 会失败且吞掉该行
          while IFS=$'\t' read -r n title created || [ -n "$n" ]; do
            [ -z "$n" ] && continue
            scanned=$((scanned + 1))
            labeled_at=""
            if labeled_at=$(gh api --paginate \
                 "repos/$GITHUB_REPOSITORY/issues/$n/timeline" \
                 --jq '.[] | select(.event=="labeled" and .label.name=="e2e-morph-expected") | .created_at' \
                 | tail -1); then
              # 查询成功但零匹配：同样要显式降级（#496 评审 🟡-3：原来只捕非零退出，
              # 空结果会静默落进成功路径，还会把创建时间当打标时间打印）
              [ -z "$labeled_at" ] && echo "::warning::PR #$n timeline 无 labeled 事件，回退用 PR 创建时间（口径可能偏早）"
            else
              echo "::warning::PR #$n timeline 查询失败，回退用 PR 创建时间（口径可能偏早）"
              labeled_at=""
            fi
            if [ -n "$labeled_at" ]; then
              when="打标于 ${labeled_at}"
            else
              labeled_at="$created"
              when="回退：PR 创建于 ${labeled_at}"
              fallback=$((fallback + 1))
            fi
            age=$(python3 -c "import sys,datetime;p=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'));print((datetime.datetime.now(datetime.timezone.utc)-p).days)" "$labeled_at")
            if [ "$age" -ge "$THRESHOLD_DAYS" ]; then
              hit=$((hit + 1))
              hit_nums="${hit_nums}#$n "
              stale="${stale}#$n ${title}（标签挂载 ${age} 天，${when}）"$'\n'
            fi
          done < "$list"

          extra=""
          if [ "$fallback" -gt 0 ]; then
            extra="；另有 ${fallback} 条取不到打标时间（已回退创建时间，口径可能偏早）"
          fi
          if [ "$hit" -gt 0 ]; then
            # 注解里带上 PR 号与计数：注解比 log/Summary 更靠近人的视野（#496 评审 🟡-1）
            echo "::error::${hit} 个开放 PR（${hit_nums% }）挂着 e2e-morph-expected 满 ${THRESHOLD_DAYS} 天，形态 diff 长期被豁免，请复核是否仍需保留（已扫描 ${scanned} 个，明细见 Step Summary）${extra}"
            printf '%s' "$stale"
            {
              echo "### ⚠️ e2e-morph-expected 标签残留（挂载满 ${THRESHOLD_DAYS} 天）"
              echo '```'
              printf '%s' "$stale"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 检出即红：绿 run 不会通知任何人（见文件头）
            exit 1
          fi
          if [ "$fallback" -gt 0 ]; then
            # 口径退化同样是「需要人看一眼」：回退用 createdAt（≤ 真实打标时间）会漏检，
            # 静默放绿等于把「巡检自己退化」读成「无残留」（#498 评审 🟡-1）
            echo "::error::本次扫描的 ${scanned} 个开放 PR 里有 ${fallback} 个取不到打标时间（已回退 PR 创建时间）⇒ 巡检口径退化、可能漏检，请查 timeline 端点/权限后重跑"
            exit 1
          fi
          echo "✅ 无长期残留的 e2e-morph-expected 标签（已扫描 ${scanned} 个挂载该标签的开放 PR，阈值 ${THRESHOLD_DAYS} 天）"
