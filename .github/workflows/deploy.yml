# ============================================================================
# InvestRing CD 持续部署流水线（backend + frontend + nginx）
# ============================================================================
# 触发条件：
#   1. main 分支 CI 通过后自动部署（上线新代码的唯一入口）
#   2. 手动触发（workflow_dispatch）：仅重新部署/回滚到已有镜像 tag（留空会被拒绝，issue #211）
#
# 部署链路：并行构建前后端镜像 → 推送阿里云 ACR → SSH 到服务器 docker compose up -d
# 目标环境：4核4G 云服务器（backend/frontend/nginx 三容器）+ 云 RDS MySQL
# 对外入口：nginx 80/443（HTTPS，Let's Encrypt）；backend 仅绑定 127.0.0.1:8000
#
# 需要配置的 GitHub Secrets：
#   ACR_REGISTRY   - ACR 地址，如 registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  - ACR 命名空间
#   ACR_USERNAME   - ACR 登录用户名
#   ACR_PASSWORD   - ACR 登录密码
#   SERVER_HOST    - 服务器 IP
#   SERVER_USER    - SSH 用户名
#   SERVER_SSH_KEY - SSH 私钥
#
# 服务器约定：
#   部署目录 /opt/investring；应用配置 .env 由服务器人工维护，
#   CD 仅更新其中 BACKEND_IMAGE_REF / FRONTEND_IMAGE_REF 两行。
#   Let's Encrypt 证书由服务器 certbot 维护（/etc/letsencrypt），不在本流水线范围。
# ============================================================================

name: Deploy

on:
  # main 分支 CI 通过后自动触发
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # 手动触发：仅用于重新部署 / 回滚到已有镜像 tag（如短 commit SHA），跳过构建直接部署该版本。
  # 收口（issue #211）：上线新代码的唯一入口是 push main 走 CI 自动部署；留空 image_tag 会被
  # setup 直接拒绝（exit 1），避免手动构建触发分支绕过 CI 覆盖生产（8-21 事故第 4 环）。
  # 前后端镜像共用同一 tag（同一 commit 构建），回滚时两者一起回退。
  # ⚠️ 回滚含数据库迁移的版本前，先按 docs/runbooks/deploy-rollback.md 判定迁移缺口。
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要回滚/重部署的已有镜像 tag（必填；留空将被拒绝）"
        required: false
        type: string

# 部署串行执行，不可中途取消
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/investring-backend
  FRONTEND_IMAGE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/investring-frontend

# 部署成功后给已部署 commit 打 deploy/ tag（回滚目标单一视图，issue #211）需要写 contents 权限
permissions:
  contents: write

jobs:
  # ==========================================================================
  # 前置判断：确定是否部署、部署哪个版本
  # ==========================================================================
  setup:
    name: "确定部署版本"
    runs-on: ubuntu-latest
    # workflow_run 仅在「push 触发的」main CI 成功时继续；手动触发总是继续。
    # ⚠️ event == 'push' 守卫不可删（issue #472）：workflow_run 对 CI 的**任何**触发源
    # 都会触发（含 nightly schedule 与手动 workflow_dispatch），少了它，nightly 在 main
    # 上绿灯会被判成「main CI 成功」→ 每晚重建前后端镜像、重启生产容器（#456 实测过的浪费）。
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      # 要部署的镜像 tag（前后端共用）
      image_tag: ${{ steps.ver.outputs.image_tag }}
      # 是否需要构建（手动指定已有 tag 时跳过构建）
      need_build: ${{ steps.ver.outputs.need_build }}
      # 构建所用的代码 commit
      checkout_ref: ${{ steps.ver.outputs.checkout_ref }}
    steps:
      - name: 计算镜像版本
        id: ver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # 手动触发：收口为仅回滚/重部署已有 tag（issue #211）。
            # 留空 image_tag 直接拒绝——上线新代码的唯一入口是 push main 走 CI 自动部署，
            # 避免手动构建触发分支绕过 CI 覆盖生产（8-21 事故第 4 环）。
            if [ -z "${{ github.event.inputs.image_tag }}" ]; then
              echo "❌ 手动部署只接受已有 tag（回滚/重部署）；上线新代码请 push main 走 CI 自动部署"
              exit 1
            fi
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "need_build=false" >> $GITHUB_OUTPUT
            echo "checkout_ref=main" >> $GITHUB_OUTPUT
          else
            # workflow_run（main CI 成功）触发：部署 CI 对应的 commit
            #（workflow_run 事件中 github.sha 是默认分支，必须用 head_sha 才能与 CI 校验的代码一致）
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "image_tag=${SHA:0:7}" >> $GITHUB_OUTPUT
            echo "need_build=true" >> $GITHUB_OUTPUT
            echo "checkout_ref=$SHA" >> $GITHUB_OUTPUT
          fi

  # ==========================================================================
  # 并行构建前后端镜像并推送至阿里云 ACR（matrix 两个并发 job）
  # ==========================================================================
  build-and-push:
    name: "构建镜像 & 推送 ACR (${{ matrix.service }})"
    needs: setup
    if: needs.setup.outputs.need_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            image: investring-backend
            context: .
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: frontend
            image: investring-frontend
            # 前端 Dockerfile 要求以 frontend/ 为上下文（根目录 .dockerignore 排除了 frontend/）
            context: frontend
            dockerfile: frontend/Dockerfile
            # rewrites 在 build 时固化：生产环境下 Next.js 经容器网络访问后端服务
            build_args: |
              API_BASE_URL=http://backend:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      # #375：被部署 commit 带 vX.Y.Z 标签（scripts/release.py 直接打在 main tip）时，
      # 镜像在 :sha7/:latest 之外追加语义标签 :vX.Y.Z（见 docs/reference/versioning.md §5）
      - name: Resolve semver image tag
        id: semver
        env:
          CHECKOUT_REF: ${{ needs.setup.outputs.checkout_ref }}
          IMAGE_BASE: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}
        run: |
          git fetch --tags --force origin
          VTAG=$(git tag --points-at "$CHECKOUT_REF" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$VTAG" ]; then
            echo "extra=${IMAGE_BASE}:$VTAG" >> "$GITHUB_OUTPUT"
            echo "语义标签: $VTAG"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:${{ needs.setup.outputs.image_tag }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ steps.semver.outputs.extra }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # 阿里云 ACR 个人版不支持 OCI attestation manifest（application/vnd.oci.empty.v1+json），
          # buildx 默认开启 provenance 会导致推送被拒（issue #141），显式关闭
          provenance: false
          sbom: false

  # ==========================================================================
  # SSH 部署到服务器（拉取镜像 → compose up → 健康检查 → 失败自动回滚）
  # ==========================================================================
  deploy:
    name: "部署到生产服务器"
    needs: [setup, build-and-push]
    # build 被跳过（部署已有 tag）时也要继续
    if: >
      !cancelled() && needs.setup.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}

      # 同步 compose 与 nginx 配置到服务器（.env 由服务器人工维护，不覆盖）
      # scp-action 保留相对路径：nginx/nginx.conf → /opt/investring/nginx/nginx.conf
      - name: Copy compose & nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: "/opt/investring"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /opt/investring
            TAG="${{ needs.setup.outputs.image_tag }}"
            BACKEND_IMG="${{ env.BACKEND_IMAGE }}:$TAG"
            FRONTEND_IMG="${{ env.FRONTEND_IMAGE }}:$TAG"

            echo "============================================"
            echo "  InvestRing 部署"
            echo "  后端镜像: $BACKEND_IMG"
            echo "  前端镜像: $FRONTEND_IMG"
            echo "============================================"

            # 0. 前置检查：.env 必须已由人工配置好（CD 只更新镜像引用两行）
            if [ ! -f .env ]; then
              echo "❌ /opt/investring/.env 不存在，请先在服务器上配置应用环境变量"
              exit 1
            fi

            # certbot webroot 目录（nginx 容器只读挂载，certbot --webroot 写入验证文件）
            mkdir -p certbot/www

            # 将镜像版本写入 .env（仅替换/追加指定行，其余配置不动），
            # 保证后续人工 docker compose up -d 也能拉起正确版本
            update_image_ref() {
              local KEY="$1" VAL="$2"
              if grep -q "^${KEY}=" .env; then
                sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" .env
              else
                echo "${KEY}=${VAL}" >> .env
              fi
            }

            # 重载 nginx 刷新 upstream 解析：nginx.conf 的 upstream 块用容器主机名，
            # 仅在配置加载时解析一次并永久缓存；backend/frontend 重建后换新 IP，
            # 而 nginx 镜像不变从不重建，不刷新会持续 502（issue #104）。
            # bind mount 陷阱（issue #119）：scp 替换 nginx.conf 会换新 inode，而容器
            # 挂载绑定的是创建时的旧 inode，reload 重读的仍是旧内容。故先比对宿主机
            # 文件与容器内挂载点的 inode：漂移时强制 restart 重建挂载视图，
            # 一致时才走无中断 reload（reload 失败再回退 restart）。
            reload_nginx() {
              local host_inode ctr_inode
              host_inode=$(stat -c %i nginx/nginx.conf)
              ctr_inode=$(docker compose exec -T nginx stat -c %i /etc/nginx/nginx.conf 2>/dev/null || true)
              if [ -z "$ctr_inode" ] || [ "$host_inode" != "$ctr_inode" ]; then
                echo "nginx.conf inode 漂移（host=$host_inode container=${ctr_inode:-<不可读>}），restart 重建挂载"
                docker compose restart nginx
              else
                docker compose exec -T nginx nginx -s reload 2>/dev/null || docker compose restart nginx
              fi
            }

            # frontend 独立探活：从 nginx 容器内经容器网络访问 frontend:7860
            #（nginx:1.27-alpine 自带 busybox wget），一举验证 frontend 存活 +
            # 网络连通 + nginx 当前解析到的 upstream IP 有效；必须排在 reload_nginx 之后。
            probe_frontend() {
              docker compose exec -T nginx wget -qO- http://frontend:7860/ > /dev/null
            }

            # 1. 登录 ACR 并拉取新镜像（先拉后停，缩短停机时间）
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} \
              -u "${{ secrets.ACR_USERNAME }}" --password-stdin
            docker pull "$BACKEND_IMG"
            docker pull "$FRONTEND_IMG"

            # 2. 记录当前运行版本（用于失败回滚）
            PREV_BACKEND=$(docker inspect --format '{{.Config.Image}}' investring-backend 2>/dev/null || true)
            PREV_FRONTEND=$(docker inspect --format '{{.Config.Image}}' investring-frontend 2>/dev/null || true)
            echo "当前后端版本: ${PREV_BACKEND:-<无>}"
            echo "当前前端版本: ${PREV_FRONTEND:-<无>}"

            # 3. 移除同名旧容器（兼容早期人工 docker run 部署的容器）
            docker rm -f investring-backend 2>/dev/null || true

            # 4. 启动/更新全部服务（compose 仅重建镜像变化的容器；
            #    后端容器启动时经 entrypoint 一次性执行 alembic upgrade head）
            update_image_ref BACKEND_IMAGE_REF "$BACKEND_IMG"
            update_image_ref FRONTEND_IMAGE_REF "$FRONTEND_IMG"
            docker compose up -d --remove-orphans

            # 4.5 重建后立即重载 nginx，避免 upstream 缓存旧容器 IP 导致入口 502
            reload_nginx

            # 5. 健康检查（最长等待 120s，覆盖迁移执行时间）
            #    后端：本机回环 8000（backend 仅绑定 127.0.0.1）
            #    入口：HTTPS 必须通过（备案期已结束，HTTP 兜底已移除，issue #119）
            check() {
              local NAME="$1"; shift
              for i in $(seq 1 60); do
                if "$@" > /dev/null 2>&1; then
                  echo "✅ ${NAME} 健康检查通过"
                  return 0
                fi
                sleep 2
              done
              echo "❌ ${NAME} 健康检查超时"
              return 1
            }

            # nginx 入口探活：HTTPS 必须通过（-k：证书按域名签发，经 localhost 访问跳过主机名校验）。
            # 443 未生效时部署必须失败并触发回滚，不得静默放行（issue #119）。
            probe_nginx() {
              curl -skf https://127.0.0.1/health > /dev/null 2>&1
            }

            HEALTHY=true
            check "后端" curl -sf http://127.0.0.1:8000/health || HEALTHY=false
            if [ "$HEALTHY" == "true" ]; then
              check "frontend" probe_frontend || HEALTHY=false
            fi
            if [ "$HEALTHY" == "true" ]; then
              check "nginx 入口" probe_nginx || HEALTHY=false
            fi

            if [ "$HEALTHY" != "true" ]; then
              echo "输出容器日志："
              docker logs --tail 100 investring-backend || true
              docker logs --tail 50 investring-frontend || true
              docker logs --tail 50 investring-nginx || true

              # 回滚前置检查：失败版本可能已执行新的 alembic 迁移，而旧镜像的
              # versions/ 目录中不存在该 revision——此时旧后端启动时 upgrade head
              # 会报 "Can't locate revision"，盲目翻回镜像只会让回滚自身失败。
              # 用旧镜像跑一次 alembic current 探测迁移缺口；其他错误（如网络抖动）
              # 不阻断回滚，保持原有兜底行为。
              # 决策路径见 docs/runbooks/deploy-rollback.md
              if [ -n "$PREV_BACKEND" ]; then
                ROLLBACK_CHECK=$(docker run --rm --env-file .env "$PREV_BACKEND" \
                  python -m alembic current 2>&1) || true
                if echo "$ROLLBACK_CHECK" | grep -q "Can't locate revision"; then
                  echo "❌ 检测到迁移缺口：数据库已应用旧镜像不认识的 alembic revision，"
                  echo "   直接回退镜像会导致旧后端启动失败，已跳过自动回滚。"
                  echo "   请按 docs/runbooks/deploy-rollback.md §4 人工决策（前滚修复或先 downgrade）。"
                  echo "   探测输出：$ROLLBACK_CHECK"
                  exit 1
                fi
              fi

              if [ -n "$PREV_BACKEND" ]; then
                echo "🔄 回滚后端到上一版本: $PREV_BACKEND"
                update_image_ref BACKEND_IMAGE_REF "$PREV_BACKEND"
              fi
              if [ -n "$PREV_FRONTEND" ]; then
                echo "🔄 回滚前端到上一版本: $PREV_FRONTEND"
                update_image_ref FRONTEND_IMAGE_REF "$PREV_FRONTEND"
              fi
              if [ -n "$PREV_BACKEND" ] || [ -n "$PREV_FRONTEND" ]; then
                docker compose up -d
                # 回滚路径同样重建了容器，必须同步刷新 nginx upstream 解析，
                # 否则回滚“成功”后入口照样 502（issue #104）
                reload_nginx
              fi
              exit 1
            fi

            # 6. 清理悬空旧镜像，释放磁盘
            docker image prune -f

            echo "============================================"
            echo "  ✅ 部署完成: tag $TAG"
            echo "============================================"

      # 部署成功后给已部署 commit 打 deploy/ tag（issue #211）：回滚目标的单一视图，
      # 手动 workflow_dispatch 回滚时 image_tag 即取此处短 SHA。仅新构建部署（need_build）打 tag，
      # 纯回滚/重部署已有 tag 不重复打。同日同 commit 重跑时 tag 已存在则跳过，避免误报失败。
      - name: Tag deployed commit
        if: needs.setup.outputs.need_build == 'true'
        run: |
          TAG="deploy/$(date +%Y%m%d)-${{ needs.setup.outputs.image_tag }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "tag $TAG 已存在于 origin，跳过"
          else
            git tag "$TAG" "${{ needs.setup.outputs.checkout_ref }}"
            git push origin "$TAG"
            echo "已打部署 tag: $TAG"
          fi
