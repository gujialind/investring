# ============================================================================
# InvestRing CD 持续部署流水线（消费发布包，不再构建 —— issue #537 第四批）
# ============================================================================
# 触发条件：
#   1. main 分支 CI 通过后自动部署（上线新代码的唯一入口）。CI 的 image-smoke
#      job 已构建、按 digest 冒烟并上传 release-bundle；本 workflow 验证触发
#      run 的来源（仓库/workflow/event/head SHA/run ID/attempt）后下载该包。
#   2. 手动触发（workflow_dispatch）：显式区分 redeploy / rollback / migrate，
#      目标是服务器上已保留的发布（state/accepted-releases.log），严格校验格式。
#
# 部署链路：来源验证 → 下载发布包 → release_bundle verify → 服务器记录快照 →
#   祖先关系判据（auto）→ scp 包与 server_deploy.sh → 服务器端锁内执行
#   stage → preflight → activate → probe（scripts/server_deploy.sh）。
# 目标环境：4核4G 云服务器（backend/frontend/nginx 三容器）+ 云 RDS MySQL
# 对外入口：nginx 80/443（HTTPS，Let's Encrypt）；backend 仅绑定 127.0.0.1:8000
#
# 需要配置的 GitHub Secrets：
#   ACR_REGISTRY / ACR_USERNAME / ACR_PASSWORD - 服务器端 docker login 拉取 digest 镜像
#   SERVER_HOST / SERVER_USER / SERVER_SSH_KEY - SSH 连接
#   SERVER_KNOWN_HOSTS - known_hosts 条目（主机指纹校验；缺失直接拒绝部署）
#
# 服务器约定（详见 scripts/server_deploy.sh 头部）：
#   /opt/investring：releases/<id> 自包含发布目录、current 原子指针、
#   state/{accepted-releases.log,last-known-good,migrate/}；
#   .env（秘密）与 certbot/ 证书由服务器人工维护，CD 只建符号链接，
#   永不复制、永不回滚。
#
# server_deploy.sh 退出码 → 本 workflow 的处置提示：
#   3 旧任务/并发拒绝；4 DB 需迁移或兼容未知（自动部署已停在写库前）；
#   5 启动/探活失败（统一策略已处理）；6 迁移 DDL 失败（现场保留，无自动回退）。
# ============================================================================

name: Deploy

on:
  # main 分支 CI 通过后自动触发
  workflow_run:
    workflows: ["CI"]
    types: [completed]

  # 手动触发：只对服务器上已保留的发布做显式操作（issue #211 收口不变：
  # 上线新代码的唯一入口是 push main 走 CI 自动部署）。
  # ⚠️ 回滚/迁移含数据库变更的版本前，先按 docs/runbooks/deploy-rollback.md 判定。
  workflow_dispatch:
    inputs:
      action:
        description: "操作类型：redeploy 重部署 / rollback 回滚 / migrate 显式迁移升级"
        required: true
        type: choice
        options: [redeploy, rollback, migrate]
      release_id:
        description: "服务器保留的发布 id（<sha7>-<run>.<attempt>，见 accepted-releases.log）"
        required: false
        type: string
      expect_state:
        description: "仅 migrate：服务器 bootstrap status 的 64 位 fingerprint（迁移授权，锁内重验）"
        required: false
        type: string

# 部署串行执行，不可中途取消
concurrency:
  group: deploy
  cancel-in-progress: false

# 默认最小权限；deploy job 单独放宽（deploy/ tag 需要 contents: write）
permissions:
  contents: read
  actions: read

jobs:
  # ==========================================================================
  # 前置判断：确定模式与目标；手动输入在这里严格校验（经 env 传递，不内插进 shell）
  # ==========================================================================
  setup:
    name: "确定部署模式与目标"
    runs-on: ubuntu-latest
    # workflow_run 仅在「push 触发的」main CI 成功时继续；手动触发总是继续。
    # ⚠️ event == 'push' 守卫不可删：workflow_run 对 CI 的**任何**触发源都会触发
    # （含手动 workflow_dispatch 跑出来的全量 CI 成功），少了它，一次手动全量的绿灯
    # 会被判成「main CI 成功」→ 重启生产容器（#456 实测过的浪费）。
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      mode: ${{ steps.ver.outputs.mode }}
      head_sha: ${{ steps.ver.outputs.head_sha }}
      run_id: ${{ steps.ver.outputs.run_id }}
      run_attempt: ${{ steps.ver.outputs.run_attempt }}
      release_id: ${{ steps.ver.outputs.release_id }}
      checkout_ref: ${{ steps.ver.outputs.checkout_ref }}
    steps:
      - name: 计算部署模式与目标
        id: ver
        env:
          INPUT_ACTION: ${{ github.event.inputs.action }}
          INPUT_RELEASE_ID: ${{ github.event.inputs.release_id }}
          INPUT_EXPECT_STATE: ${{ github.event.inputs.expect_state }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          WR_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动输入全部经 env 传入后严格校验；不合法直接拒绝，不含糊回退
            case "$INPUT_ACTION" in
              redeploy|rollback|migrate) ;;
              *) echo "❌ 未知 action: '$INPUT_ACTION'"; exit 1 ;;
            esac
            if ! [[ "$INPUT_RELEASE_ID" =~ ^[0-9a-f]{7}-[0-9]+\.[0-9]+$ ]]; then
              echo "❌ release_id 非法: '$INPUT_RELEASE_ID'（期望 <sha7>-<run>.<attempt>，"
              echo "   取自服务器 /opt/investring/state/accepted-releases.log 或 deploy/ tag 对应记录）"
              exit 1
            fi
            if [ "$INPUT_ACTION" = "migrate" ]; then
              if ! [[ "$INPUT_EXPECT_STATE" =~ ^[0-9a-f]{64}$ ]]; then
                echo "❌ migrate 必须提供 expect_state（服务器 bootstrap status 输出的 64 位 fingerprint）"
                exit 1
              fi
            elif [ -n "$INPUT_EXPECT_STATE" ]; then
              echo "❌ expect_state 只允许用于 migrate；redeploy/rollback 不做数据库变更"
              exit 1
            fi
            {
              echo "mode=$INPUT_ACTION"
              echo "head_sha="
              echo "run_id="
              echo "run_attempt="
              echo "release_id=$INPUT_RELEASE_ID"
              echo "checkout_ref=main"
            } >> "$GITHUB_OUTPUT"
          else
            # workflow_run（main push CI 成功）触发：部署 CI 对应的 commit 与 run 产物
            #（github.sha 在 workflow_run 事件中是默认分支 tip，必须用 head_sha）
            if ! [[ "$WR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
               || ! [[ "$WR_RUN_ID" =~ ^[0-9]+$ ]] || ! [[ "$WR_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
              echo "❌ workflow_run 事件字段非法，拒绝部署"
              exit 1
            fi
            {
              echo "mode=auto"
              echo "head_sha=$WR_HEAD_SHA"
              echo "run_id=$WR_RUN_ID"
              echo "run_attempt=$WR_RUN_ATTEMPT"
              echo "release_id=${WR_HEAD_SHA:0:7}-${WR_RUN_ID}.${WR_RUN_ATTEMPT}"
              echo "checkout_ref=$WR_HEAD_SHA"
            } >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================================
  # 部署：来源验证 → 发布包消费 → 服务器端锁内 stage/preflight/activate/probe
  # ==========================================================================
  deploy:
    name: "部署到生产服务器"
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write    # 部署成功后打 deploy/ tag（issue #211 回滚目标单一视图）
      actions: read      # 来源验证与发布包下载
    env:
      MODE: ${{ needs.setup.outputs.mode }}
      HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
      CI_RUN_ID: ${{ needs.setup.outputs.run_id }}
      CI_RUN_ATTEMPT: ${{ needs.setup.outputs.run_attempt }}
      RELEASE_ID: ${{ needs.setup.outputs.release_id }}
      INPUT_RELEASE_ID: ${{ github.event.inputs.release_id }}
      INPUT_EXPECT_STATE: ${{ github.event.inputs.expect_state }}
      SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
      BASE: /opt/investring
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.checkout_ref }}
          fetch-depth: 0    # 祖先判据需要完整历史（git merge-base --is-ancestor）

      # 不只信 workflow_run 事件载荷（可被伪造/错配）：用 API 按 run ID+attempt
      # 拉取权威记录，核对仓库、workflow、event、head SHA、结论（第四批 B 要求）
      - name: 验证触发 CI run 来源
        if: env.MODE == 'auto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/attempts/$CI_RUN_ATTEMPT")"
          echo "$RUN_JSON" | jq -e \
            --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" \
            --arg attempt "$CI_RUN_ATTEMPT" '
              .head_sha == $sha
              and .head_branch == "main"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and (.run_attempt | tostring) == $attempt
              and ((.head_repository.full_name // "") | ascii_downcase) == ($repo | ascii_downcase)
            ' > /dev/null || { echo "❌ 触发 run 来源验证失败（仓库/分支/event/SHA/结论不符）"; exit 1; }
          WORKFLOW_ID="$(echo "$RUN_JSON" | jq -r '.workflow_id')"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID" \
            | jq -e '.path == ".github/workflows/ci.yml" and .name == "CI"' > /dev/null \
            || { echo "❌ 触发 workflow 不是可信 CI（.github/workflows/ci.yml）"; exit 1; }
          echo "✅ 来源验证通过: run $CI_RUN_ID.$CI_RUN_ATTEMPT @ ${HEAD_SHA:0:12}"

      - name: 下载并校验发布包
        if: env.MODE == 'auto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gh run download 不支持按 attempt 选制品（2026-09-25 首次生产 CD 实证：
          # 传入该参数直接 unknown flag 致红）。attempt 绑定不靠下载参数：
          # 下面的「release-id ↔ 包身份互证」要求包内 git.sha/run_id/run_attempt
          # 拼出的 rid 与目标 release-id 逐字一致，下到错误 attempt 的包必被拒绝。
          gh run download "$CI_RUN_ID" --name release-bundle --dir bundle
          # 与 CI 生产侧同一判据（scripts/release_bundle.py verify），不抄第二份
          python3 scripts/release_bundle.py verify --bundle-dir bundle --sha "$HEAD_SHA"
          # release-id 与包身份互证（与服务器端 verify_bundle_identity 同一规则）
          python3 - "$RELEASE_ID" <<'PY'
          import json, sys
          b = json.load(open("bundle/bundle.json"))
          rid = f"{b['git']['sha'][:7]}-{b['build']['run_id']}.{b['build']['run_attempt']}"
          if rid != sys.argv[1]:
              sys.exit(f"❌ 发布包身份 {rid} 与目标 release-id {sys.argv[1]} 不一致")
          print(f"✅ 发布包校验通过: {rid}")
          PY

      - name: 配置 SSH（主机指纹校验）
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # 无已知主机指纹则拒绝连接：防中间人替换部署目标（第四批 C 要求）
          if [ -z "$SERVER_KNOWN_HOSTS" ]; then
            echo "❌ SERVER_KNOWN_HOSTS 未配置；拒绝不做主机指纹校验的 SSH 部署"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: 同步部署脚本与发布包
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # SSH_OPTS 需要分词
          ssh $SSH_OPTS "$SERVER" "mkdir -p '$BASE/incoming'"
          scp $SSH_OPTS scripts/server_deploy.sh "$SERVER:$BASE/server_deploy.sh"
          ssh $SSH_OPTS "$SERVER" "chmod +x '$BASE/server_deploy.sh'"
          if [ "$MODE" = "auto" ]; then
            # 每次重新落地，避免半个旧包混入（服务器端还会 sha256sum -c 复核）
            ssh $SSH_OPTS "$SERVER" \
              "rm -rf '$BASE/incoming/$RELEASE_ID' && mkdir -p '$BASE/incoming/$RELEASE_ID'"
            scp $SSH_OPTS -r bundle/. "$SERVER:$BASE/incoming/$RELEASE_ID/"
          fi

      - name: 读取服务器发布记录并验证祖先关系
        run: |
          set -euo pipefail
          # 记录快照在锁外读取；server_deploy.sh 会在 flock 内重读比对（--expect-accepted），
          # 快照过期即按旧任务拒绝——两步之间被并发任务插队不会静默通过
          PREV="$(ssh $SSH_OPTS "$SERVER" "bash '$BASE/server_deploy.sh' record --last-auto --base '$BASE'")"
          PREV_SHA="$(awk '{print $1}' <<<"$PREV")"
          PREV_SPEC="$(awk '{print ($1 == "none" ? "none" : $2)}' <<<"$PREV")"
          # 服务器输出也不可尽信：格式校验后才允许拼进后续远程命令
          [[ "$PREV_SHA" =~ ^(none|[0-9a-f]{40})$ ]] || { echo "❌ 记录快照 SHA 非法: '$PREV_SHA'"; exit 1; }
          [[ "$PREV_SPEC" =~ ^(none|[0-9]+\.[0-9]+)$ ]] || { echo "❌ 记录快照 run 规格非法: '$PREV_SPEC'"; exit 1; }
          echo "PREV_SPEC=$PREV_SPEC" >> "$GITHUB_ENV"
          if [ "$MODE" = "auto" ]; then
            # 旧任务晚到 / 历史分叉在这里拒绝；docs-only 提交推进 main 不误挡（祖先≠父子）
            python3 scripts/deploy_ancestry.py \
              --prev-sha "$PREV_SHA" --head-sha "$HEAD_SHA" --repo-root .
          fi

      - name: 服务器端 ACR 登录
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          # 密码经 stdin 传给远端 docker login，不进 argv、不回显
          printf '%s' "$ACR_PASSWORD" | ssh $SSH_OPTS "$SERVER" \
            "docker login '$ACR_REGISTRY' -u '$ACR_USERNAME' --password-stdin"

      - name: 执行部署
        run: |
          set -uo pipefail
          CMD=deploy
          TARGET="$RELEASE_ID"
          if [ "$MODE" != "auto" ]; then
            CMD="$MODE"
            TARGET="$INPUT_RELEASE_ID"
          fi
          ARGS="$CMD --release-id $TARGET --base $BASE --expect-accepted $PREV_SPEC"
          if [ "$MODE" = "auto" ]; then
            ARGS="$ARGS --incoming $BASE/incoming/$TARGET"
          fi
          if [ "$MODE" = "migrate" ]; then
            ARGS="$ARGS --expect-state $INPUT_EXPECT_STATE"
          fi
          set +e
          # shellcheck disable=SC2086  # ARGS 分词是预期行为；各字段均已严格校验
          ssh $SSH_OPTS "$SERVER" "bash '$BASE/server_deploy.sh' $ARGS"
          RC=$?
          set -e
          case "$RC" in
            0) echo "✅ 部署完成: $TARGET（mode=$MODE）" ;;
            3) echo "⛔ 旧任务/并发拒绝：服务器已接受了更新的部署。核对 accepted-releases.log 后如需上线本版本请重新触发。" >&2 ;;
            4) echo "⛔ 数据库需迁移/初始化或兼容状态未知：自动部署已停在任何写库启动之前，未激活。" >&2
               echo "   下一步：ssh 服务器执行 docker compose … run --rm --no-deps backend python -m app.bootstrap status" >&2
               echo "   取 fingerprint 并人工核对迁移内容后，workflow_dispatch：action=migrate release_id=$TARGET expect_state=<fingerprint>" >&2 ;;
            5) echo "⛔ 启动/reload/探活失败：已按统一策略处理（恢复上一发布或保留现场）。查看服务器 state/accepted-releases.log 与容器日志。" >&2 ;;
            6) echo "⛔ 迁移 DDL 失败：未做自动回滚/downgrade；DDL 前状态已持久化在 $BASE/state/migrate/，按 docs/runbooks/deploy-rollback.md 人工处置。" >&2 ;;
            *) echo "⛔ 部署脚本 harness 错误（exit $RC）；未改动运行状态或状态未知，先核对服务器再重试。" >&2 ;;
          esac
          exit "$RC"

      # 部署成功后给已部署 commit 打 deploy/ tag（issue #211）：回滚目标单一视图。
      # 仅 auto（新代码上线）打 tag；手动 rollback/redeploy/migrate 不重复打。
      - name: Tag deployed commit
        if: env.MODE == 'auto'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="deploy/$(date -u +%Y%m%d)-${HEAD_SHA:0:7}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "tag $TAG 已存在于 origin，跳过"
          else
            git tag "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/$TAG"
            echo "已打部署 tag: $TAG"
          fi
