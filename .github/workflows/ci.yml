# ============================================================================
# InvestRing CI 持续集成流水线
# ============================================================================
# 范围：后端测试 + CLI 契约校验 + 前端 lint/类型/构建门禁 + 前端 E2E（issue #168）
#        + E2E 形态对比（issue #410：纯测试重构 PR 的 pass/skip 形态双侧 diff 门禁）
# 触发条件：push 到 main（合入后）或 pull request 到 main（issue #211 单分支模型）
# 测试数据库：
#   - SQLite（conftest.py 默认模式，快速反馈）
#   - MySQL 8.4 service 容器（对齐生产 RDS，覆盖方言差异 + 迁移链验证）
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # labeled：e2e-compare 的 e2e-morph-expected 豁免靠打标签触发重跑
    #（手动 re-run 不刷新 event payload，看不到新标签）
    types: [opened, synchronize, reopened, labeled]

# 并发控制：按「事件类型 + 源分支」分组，同组只保留最新运行。
# 事件类型入组（issue #211）：push（合入 main 后）与 pull_request（feature→main）分属不同组，
# 互不取消——required check 语义下「被取消」= 未通过会卡住 PR。
# head_ref（PR 源分支名）优先，push 事件回落到 ref_name（分支名）。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Python 版本与生产镜像（python:3.12-slim）保持一致
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SQLite 模式运行全量测试（unit + integration + e2e）；
      # 覆盖率仅在本 job 收集；口径（含分支）与硬阈值 fail_under 见
      # backend/pyproject.toml [tool.coverage.*]（issue #254 设防期，#171 观察期已结束）
      - name: Run tests with pytest
        env:
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
        run: |
          pytest tests/ -q --tb=short --strict-markers --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        continue-on-error: true  # 诊断品上传失败不染红 job（artifact 服务间歇 403，#414）
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # MySQL 门禁：覆盖 SQLite 测不出的方言差异（VARCHAR 长度、DECIMAL 截断、
  # 隐式排序、排序规则等），并验证生产启动顺序（create_all → alembic upgrade head）
  backend-test-mysql:
    name: "Backend Tests (MySQL)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级字符集与排序规则对齐生产 RDS（utf8mb4 / utf8mb4_general_ci，#433 起统一）。
      # 连接串侧同样是 charset=utf8mb4，两侧一致才不会有「4 字节 UTF-8 字符（emoji、
      # CJK 扩展 B）撞 utf8mb3 列 → errno 1366 → 整条记录写不进去」这个缺陷面：
      # #427 曾在 utf8mb3 库内把五张自由文本表单独提为 utf8mb4 作例外，#433 把库级
      # 一并统一、例外清单随之取消（迁移 0015）。改回 utf8mb3 会让 test_db_charset.py
      # 与 test_migration_0015.py 变红。
      #
      # 注：`CREATE DATABASE` 的库级设置只决定**将来**建表的默认值，不会改动已存在的表；
      # 且新库路径下 `create_all`（main.py import 期）在迁移之前跑，故模型层另有
      # app/models/base.py 的钩子确保每张表自带 CHARSET，不单纯依赖这里。
      - name: Create databases
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_test CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
            CREATE DATABASE ir_migration CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

      # 复刻生产启动顺序：main.py import 期 create_all 建全表，lifespan 内 upgrade head 增量修补
      - name: Verify migration chain (create_all + alembic upgrade head)
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_migration?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
          # 可逆性豁免开关：仅限引入不可逆迁移（如 DROP 列）的 PR 临时置 true，
          # 合入后必须改回 false（issue #170）
          SKIP_DOWNGRADE: "false"
        run: |
          python -c "from app.database import engine; from app.models.base import Base; import app.models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head
          alembic current | grep "(head)"
          # 可逆性验证：downgrade -1 只回退最新一条迁移（已知不可逆的 0006/0008 不会被触碰）
          if [ "${SKIP_DOWNGRADE}" != "true" ]; then
            alembic downgrade -1
            alembic upgrade head
            alembic current | grep "(head)"
          else
            echo "::warning::SKIP_DOWNGRADE=true，跳过迁移可逆性验证，合入后请移除此豁免"
          fi

      - name: Run tests with pytest (MySQL)
        env:
          TEST_DB_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_test?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          pytest tests/ -q --tb=short --strict-markers

  # CLI 契约防漂移校验（issue #170 扩展）：
  #   1. openapi.json 漂移门禁——进程内生成 schema 与已提交契约比对
  #   2. ir-cli 响应字段契约校验
  #   3. ir-cli 单元测试
  cli-contract-check:
    name: "CLI Contract Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # openapi.json 漂移门禁：改 router/schema 忘记重新导出时 exit 1
      # （import app.main 会对临时 sqlite 执行 create_all + init_scheduled_tasks，无需起服务）
      - name: Check openapi.json drift
        env:
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
        run: python backend/check_openapi.py

      # 不一致时 exit 1：请运行 `python ir-cli/scripts/gen_response_fields.py` 重新生成并提交
      - name: Check response fields contract
        run: |
          python ir-cli/scripts/gen_response_fields.py --check

      - name: Install ir-cli and run unit tests
        run: |
          pip install -e ir-cli pytest
          pytest ir-cli/tests -q

  # 前端门禁：前端已容器化部署，类型/语法错误与构建失败必须在 CI 拦住
  # （历史上因无前端门禁漏过任务页 map 崩溃等问题）
  frontend-check:
    name: "Frontend Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Node 版本与 frontend/Dockerfile、frontend/.nvmrc 保持一致
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      # 单元测试（issue #253）：lib 纯逻辑层快速拦截，置于耗时的 build 之前
      - name: Unit tests
        run: npm run test

      # next build 内部也会跑 lint + tsc，但单独前置两步能更快定位失败原因
      - name: Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # 前端 E2E 门禁（issue #168）：真实浏览器验证登录/页面渲染/防 P0 复发，
  # 拦截"接口正确但用户用不了"的问题（白屏崩溃、死链、双导航等）。
  # 后端跑在 MySQL 8.4 上（对齐 backend-test-mysql 的"对齐生产 RDS"哲学）。
  #
  # 运行前提（勿删）：
  #   - E2E 登录用例依赖 ADMIN/admin@2026 用户，业务 spec 经 e2e/helpers.ts 按 code
  #     直达两个种子组合：draft E2E_PORT（表单交互/首购激活）+ active E2E_ACTIVE
  #     （#354：快照/持仓/编辑交易，消除旧「无组合即静默全 skip、覆盖蒸发」），
  #     均由 scripts/seed_e2e.py 种子产生（种子体与 pytest 同源：tests/seed_base.py），
  #     删除 seed 步骤登录必挂、业务 spec 因缺组合硬失败
  #   - 前端 next.config.js 将 /api/* rewrite 到 localhost:8000，故需真实后端
  frontend-e2e:
    name: "Frontend E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # ---- 后端：建库 → 迁移 → seed → 启动（生产启动顺序：create_all 由 main.py import 期完成）----
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级字符集对齐 backend-test-mysql（utf8mb4 / utf8mb4_general_ci，#433 起统一）
      - name: Create database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

      # 复刻生产启动顺序（对齐 backend-test-mysql）：create_all 先建全表，
      # alembic upgrade head 增量修补——迁移链依赖 create_all 已建表
      # （如 0007 直接 UPDATE product），单独跑迁移会报表不存在
      - name: Create schema and run migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          python -c "from app.database import engine; from app.models.base import Base; import app.models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head

      # 种子 ADMIN/admin@2026 + draft 组合 E2E_PORT + active 组合 E2E_ACTIVE
      # （E2E 登录与业务 spec 按 code 直达依赖，勿删；种子体与 pytest 同源：
      # backend/tests/seed_base.py，issue #222 / #354）
      - name: Seed E2E base data
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: python scripts/seed_e2e.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      # ---- 前端：生产构建 + webServer 由 playwright.config.ts 自动起 standalone server.js（:3000）----
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # E2E 跑生产构建形态（issue #171）：standalone server.js 与 Docker
      # 容器完全同形态（next start 与 output:'standalone' 不兼容）；
      # API_BASE_URL 默认 localhost:8000，build 时固化的 rewrites 恰与
      # 本 job 后端地址一致，无需额外传参。
      # standalone 不包含 public/ 与 .next/static/，组装步骤与 Dockerfile 一致。
      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      # 浏览器二进制缓存（issue #172）：key 绑定 package-lock.json
      # （@playwright/test 版本决定所需浏览器构建）；未命中时回退全新安装
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # 桌面 chromium + 移动 webkit（mobile 用 iPhone 13 描述符，
      # 见 playwright.config.ts 注释；PR #169 遗留的 webkit 307 取消问题
      # 已定位为 dev 竞态并修复，恢复真实 Safari 内核覆盖）。
      # 拆步 + 预置 apt-get update：--with-deps 内置 update 遇首选镜像
      # （azure.archive.ubuntu.com）不可达时会长时间重试卡死；先单独
      # update 让 apt 完成镜像回退，后续内置 update 全 Hit 很快。
      # timeout-minutes 兼作快速失败护栏（正常 ≤5 分钟）。
      - name: Update apt index
        run: sudo apt-get update

      - name: Install Playwright chromium
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright webkit
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright install --with-deps webkit

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      # 失败证据（trace/截图/视频）+ 后端启动日志（后端启动失败时的定位证据，
      # issue #172），always 上传保证失败时也能取到
      - name: Upload Playwright report
        if: always()
        continue-on-error: true  # 诊断品上传失败不染红 job（artifact 服务间歇 403，#414）
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend-e2e.log
          retention-days: 14

  # Dockerfile 构建冒烟（issue #170）：每个 PR 验证两个 Dockerfile 可构建，
  # 避免「构建问题合入 main 触发 CD 才暴露」（#141 ACR 拒推 provenance 即此类）。
  # 与 deploy.yml 共用 gha 缓存 scope（相互预热）；push: false 不产生 ACR tag。
  docker-build-smoke:
    name: "Docker Build Smoke (${{ matrix.service }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            # rewrites 在 build 时固化，与 deploy.yml 保持一致
            build_args: |
              API_BASE_URL=http://backend:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build_args }}
          tags: investring-${{ matrix.service }}:smoke
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # 与 deploy.yml 一致：ACR 个人版不支持 OCI attestation（issue #141）
          provenance: false
          sbom: false

  # E2E 形态对比（issue #410）：纯测试重构 PR 的「假绿灯」防线——base 与 PR 两侧
  # 各跑一遍全量 E2E，归一化（scripts/e2e_normalize.py）成 TSV 后 diff，期望空 diff；
  # 非空 diff 拦合入，预期形态变化（增删用例/调整 skip）的 PR 打 e2e-morph-expected
  # 标签豁免。两侧构建源同为 PR head，唯一变量是 frontend/e2e/ 目录；CI runner 天然
  # 隔离，本地脚本 verify-e2e-pr.sh 的隔离层（挑端口/独立 db/swap spec/trap）随之整删。
  changes:
    name: "Detect E2E Morphology Inputs"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e_morph: ${{ steps.detect.outputs.hit }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # 纯 git 检测（不引第三方 action）。路径清单含 playwright.config.ts 与
      # 种子文件——它们同样改变 pass/skip 形态；ci.yml 自身在列（本 job 的 dogfood）。
      - id: detect
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            | grep -qE '^(frontend/e2e/|frontend/playwright\.config\.ts|backend/tests/seed_base\.py|backend/scripts/seed_e2e\.py|scripts/e2e_normalize\.py|scripts/tests/|\.github/workflows/ci\.yml)'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  # normalizer 单测独立成 micro job：不挂 backend-test（该 job 带 --cov=app +
  # fail_under=80，scripts/tests 不在覆盖率口径内，混入信号混乱）
  scripts-test:
    name: "Scripts Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run scripts tests
        run: |
          pip install pytest
          python -m pytest scripts/tests -q

  # 栈步骤与 frontend-e2e 逐行同构（MySQL/建库/迁移/种子/uvicorn/构建/浏览器）；
  # 差异仅：baseline 侧换 e2e 目录、--retries=0、JSON reporter 落文件。
  e2e-compare-capture:
    name: "E2E Capture (${{ matrix.side }})"
    needs: changes
    if: needs.changes.outputs.e2e_morph == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false  # 一侧挂了另一侧仍跑完留证
      matrix:
        side: [baseline, candidate]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # baseline 侧只换 e2e 目录，构建源仍是 PR head——「同一构建、唯一变量是
      # frontend/e2e/**」不变量（#401 场景：测试重构 + src 补 data-testid 依赖这一点）。
      # 先 rm -rf 再 checkout：head 独有 spec 会残留跑成并集（旧脚本 SWAP_ORPHANS
      # 同源坑）；e2e/.auth/admin.json 是 gitignore 的、由 setup project 重建，删了无妨。
      - name: Swap e2e to base (baseline only)
        if: matrix.side == 'baseline'
        run: |
          rm -rf frontend/e2e
          git checkout "${{ github.event.pull_request.base.sha }}" -- frontend/e2e

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级字符集对齐 backend-test-mysql（utf8mb4 / utf8mb4_general_ci，#433 起统一）
      - name: Create database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;"

      - name: Create schema and run migrations
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          python -c "from app.database import engine; from app.models.base import Base; import app.models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head

      - name: Seed E2E base data
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: python scripts/seed_e2e.py

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ir_e2e?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          SCHEDULER_ENABLED: "false"
          DEBUG: "false"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e-compare.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Update apt index
        run: sudo apt-get update

      - name: Install Playwright chromium
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      - name: Install Playwright webkit
        working-directory: frontend
        timeout-minutes: 15
        run: npx playwright install --with-deps webkit

      # CI=true 保 reuseExistingServer=false；--retries=0 覆盖 config（CI?2:0）——
      # retry 会把 flaky 洗成 passed，形态对比失真。用例 fail 是合法数据（进 JSON →
      # TSV → diff），rc 吞掉不拦本 job，成败由 e2e-compare 判定。
      # PLAYWRIGHT_JSON_OUTPUT_FILE 必须显式落文件：--reporter=list,json 下 list
      # 也打 stdout，混流会毁 JSON。
      - name: Run Playwright tests (capture)
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/e2e-raw-${{ matrix.side }}.json
        run: |
          rc=0
          npx playwright test --retries=0 --workers=2 --reporter=list,json || rc=$?
          echo "playwright rc=$rc（非 0 = 有用例未通过，状态已进 JSON）"

      # JSON 缺失 = 运行本身坏了（构建/webServer/配置），响亮失败而非静默空 diff
      - name: Upload raw JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-raw-${{ matrix.side }}
          path: /tmp/e2e-raw-${{ matrix.side }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure evidence
        if: always()
        continue-on-error: true  # 诊断品上传失败不染红 job（#414）；上方 raw JSON 是 compare 必需输入、保持阻塞
        uses: actions/upload-artifact@v7
        with:
          name: e2e-raw-${{ matrix.side }}-results
          path: |
            frontend/test-results/
            backend-e2e-compare.log
          if-no-files-found: warn
          retention-days: 14

  e2e-compare:
    name: "E2E Morphology Compare"
    needs: e2e-compare-capture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 默认 checkout PR merge commit：用 PR 版 normalizer 处理两侧 raw，自洽
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download raw JSON
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-raw-*
          path: /tmp/raw

      - name: Normalize both sides
        run: |
          python3 scripts/e2e_normalize.py \
            --input /tmp/raw/e2e-raw-baseline/e2e-raw-baseline.json \
            --output /tmp/base.tsv --projects chromium,mobile --side baseline
          python3 scripts/e2e_normalize.py \
            --input /tmp/raw/e2e-raw-candidate/e2e-raw-candidate.json \
            --output /tmp/cand.tsv --projects chromium,mobile --side candidate

      # diff 退出码显式捕获，不依赖 shell 的 pipefail 默认值
      - name: Diff morphology
        env:
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-morph-expected') }}
        run: |
          rc=0
          diff /tmp/base.tsv /tmp/cand.tsv > /tmp/morph.diff || rc=$?
          cat /tmp/morph.diff
          if [ "$rc" -eq 0 ]; then echo "✅ 形态一致（空 diff）"; exit 0; fi
          {
            echo '### E2E 形态 diff'
            echo '```diff'
            cat /tmp/morph.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXEMPT" = "true" ]; then
            echo "::warning::形态有差异，经 e2e-morph-expected 标签放行"
            exit 0
          fi
          echo "::error::E2E 形态非预期变化；若属预期（增删用例/调整 skip），请给 PR 加 e2e-morph-expected 标签（labeled 触发重跑）"
          exit 1

  # 汇总门禁（issue #211）：作为 main 分支唯一的 required status check。
  # 不直接把 matrix 展开的 Docker Build Smoke / 偏发的 Frontend E2E 设为 required，
  # 而是用本 job needs 全部实质 job 后统一判定——任一 failure/cancelled 即失败，
  # skipped 视为通过（changes/e2e-compare 系在非 e2e PR 与 push 事件下跳过，issue #410）。
  ci-ok:
    name: "CI OK"
    if: always()
    needs:
      - backend-test
      - backend-test-mysql
      - cli-contract-check
      - frontend-check
      - frontend-e2e
      - docker-build-smoke
      - changes
      - scripts-test
      - e2e-compare-capture
      - e2e-compare
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "needs results: $results"
          case "$results" in
            *failure*|*cancelled*)
              echo "❌ CI 未全绿（存在 failure/cancelled）"
              exit 1
              ;;
          esac
          echo "✅ 全部必需 job 成功"
