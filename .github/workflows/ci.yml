# ============================================================================
# InvestRing CI 持续集成流水线
# ============================================================================
# 范围：后端测试 + CLI 契约校验 + 前端 lint/类型/构建门禁 + 前端 E2E（issue #168）
#        + E2E 形态对比（issue #410：纯测试重构 PR 的 pass/skip 形态双侧 diff 门禁）
# 触发条件：push 到 main（合入后）、pull request 到 main（issue #211 单分支模型）、
#           workflow_dispatch 手动全量。
#           push 侧带 paths-ignore，纯文档改动合入不触发 CI ⇒ 不触发 CD（issue #456；
#           约束与地雷见下方 `on.push` 注释）。pull_request 侧刻意无过滤——required
#           check `CI OK` 不能在 docs-only PR 上缺席。
#
# 路径感知裁剪（issue #462）：PR 侧只跑改动触达的 job（`changes` job 输出
# backend / frontend / cli / scripts / e2e_morph，各 job 以 `needs.changes.outputs.*`
# 为 if 条件）；push / workflow_dispatch 侧一律保守全量（main 必须完整验证）。裁剪
# 安全性依赖 `CI OK` 把 skipped 视为通过（本文件 ci-ok job 的判据），不会重现
# #377/#456 的 required check 死锁。
# 组合破坏盲区（A 只改后端、B 只改前端，各自绿但组合坏）与纯时间型失效（#468 型：
# 夹具日历/过滤窗跟着真实时间走）由 push 侧保守全量与下一个触碰该栈的 PR 兜底——
# 刻意不引入 nightly 定时体检（#472 declined）。裁剪取舍的完整论证见 #482。
# 注：`label-hygiene.yml` 是另一个独立的定时 workflow，只查 e2e-morph-expected 标签
#     残留、不跑任何 CI job，与「不做 nightly 定时体检」无关（#483）。
# 路径映射见 `changes` job 的注释；改映射必须同步考虑 `test_error_codes_doc_sync.py`
# 对 docs/ 的断言依赖与 E2E 种子文件对 frontend 的依赖。
#
# 注：文档并非与 CI 完全无关——`backend/tests/unit/test_error_codes_doc_sync.py`（#418）
#     以 `docs/reference/business-constraints.md` 为断言输入。该测试在 PR 侧照常运行
#     （验证发生在合入前），main 侧纯文档合入不再复跑属预期，不是缺口。
# 测试数据库：
#   - SQLite（conftest.py 默认模式，快速反馈）
#   - MySQL 8.4 service 容器（对齐生产 RDS，覆盖方言差异 + 迁移链验证）
# ============================================================================

name: CI

# 最小权限（#464 评审）：本 workflow 只读仓库——各 job 无写需求（诊断品走 artifact /
# Step Summary；标签判定读 event payload，不走 API），故收紧到 contents: read。收紧后
# 即使第三方 action（如 junit 注解）被投毒也拿不到写权限。
permissions:
  contents: read

on:
  push:
    branches: [main]
    # 文档类改动不重建镜像（issue #456）：被过滤时 GitHub 不产生 CI run →
    # deploy.yml 的 workflow_run 不触发 → 不重部署。实测背景：PR #454（纯 .md）
    # 合入后仍跑了一整轮 CD，重建前后端镜像并重启生产容器。
    #
    # ⚠️ 必须写 `**/*.md`，不能写 `**.md`：`**` 后无 `/` 时退化为 `*.md`，
    #    只匹配根目录（实测本仓 34 个 tracked .md 只命中 11 个，子目录 23 个漏网）。
    # ⚠️ 绝不能给下面的 pull_request 加 paths-ignore：ruleset `protect main` 的
    #    required check 是 `CI OK`，docs-only PR 上它会永不产出 → PR 永久卡住，
    #    与 #377（改 PR base 不触发 CI）同型死锁。PR 侧不过滤恰好保证合入前仍有完整验证。
    # 刻意只做后缀/目录式匹配，不用 `docs*`、`*.md*` 或「忽略根目录」这类宽匹配——
    # 写宽了会让代码改动静默不跑 CI，与「跑了且通过」肉眼不可区分。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    # labeled：e2e-compare 的 e2e-morph-expected 豁免靠打标签触发重跑
    #（手动 re-run 不刷新 event payload，看不到新标签）
    types: [opened, synchronize, reopened, labeled]
  # 手动全量（main 上按需重跑完整 CI，或对任意 ref 触发全量验证；唯一的
  # per-branch 全量手段）。
  # ⚠️ 手动触发的 run 同样被 deploy.yml 的 `workflow_run.event == 'push'` 守卫挡住，
  # 不会触发 CD——该守卫不可删，理由见 deploy.yml setup job 注释。
  workflow_dispatch:

# 并发控制：按「事件类型 + 源分支」分组，同组只保留最新运行。
# 事件类型入组（issue #211）：push（合入 main 后）与 pull_request（feature→main）分属不同组，
# 互不取消——required check 语义下「被取消」= 未通过会卡住 PR。
# head_ref（PR 源分支名）优先，非 PR 事件（push / workflow_dispatch）无 head_ref，
# 回落 ref_name（分支名）后按「事件类型 + 分支」自然分组。
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# 顶层 env 收敛（issue #462）：SECRET_KEY / SCHEDULER_ENABLED / DEBUG 此前在 8-10 个
# step 上重复声明，改一处口径要在多处同步。DEBUG 恒 false：CI 无需 SQL echo（日志降噪，
# 原 backend-test / cli-contract-check 走 settings 默认 True，行为随之变化）。
env:
  SECRET_KEY: test-secret-key-for-ci
  SCHEDULER_ENABLED: "false"
  DEBUG: "false"

jobs:
  backend-test:
    name: "Backend Tests"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch-depth 0：diff-cover 需要 PR base.sha 可达（默认浅克隆只有 head）
          fetch-depth: 0

      # Python 版本与生产镜像（python:3.12-slim）保持一致
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # SQLite 模式运行全量测试（unit + integration + e2e）；
      # 覆盖率仅在本 job 收集；口径（含分支）与硬阈值 fail_under 见
      # backend/pyproject.toml [tool.coverage.*]（issue #254 设防期，#171 观察期已结束）。
      # --junitxml 供 PR 注解（#465）；--durations=20 暴露慢用例（并行分片/超时调优的
      # 数据来源），二者都不影响退出码。
      - name: Run tests with pytest
        run: |
          pytest tests/ -q --tb=short --strict-markers --cov=app --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml --durations=20

      # 增量覆盖率门禁（issue #464）：只约束本 PR 改动行，堵住「新模块 0% 覆盖被既有
      # 高覆盖稀释通过」的缺口；全局 fail_under=82 仍兜整体退化，两者职责正交。
      # 从仓库根运行并传 backend/coverage.xml：diff-cover 自行按 git root 对齐
      # coverage.xml 的 <source>（绝对路径 + filename 相对 app/；实测 cwd 不影响选行，
      # 见 #464 评审）；显式 working-directory 是为了让 `diff-cover.md` 落在仓库根
      # （Summary 与 artifact 依赖该相对路径）。
      # base.sha 三点式 diff = 本 PR 自身改动（含 main 侧后续合入不受影响）。
      - name: Diff coverage gate (PR changed lines)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          diff-cover backend/coverage.xml \
            --compare-branch=${{ github.event.pull_request.base.sha }} \
            --fail-under=80 --format markdown:diff-cover.md

      - name: Append diff coverage summary
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        run: cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # 门禁退化可见化（#464 评审）：路径映射若断裂，diff-cover 会输出
      # 「No lines with coverage information」并 exit 0——门禁静默空转（改动行一行没被
      # 约束而 CI 全绿）。有新增行落在 backend/app/ 时发 warning 提示人工确认；
      # 刻意不 fail：只改注释/docstring 的 PR 也会合法地没有可测行，硬拦会误伤。
      - name: Warn on unmapped diff (PR)
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        run: |
          # 默认 shell 是 `bash -e {0}`（无 pipefail），git diff 失败会被 awk 吞成 added=0
          # 而静默跳过告警——显式开 pipefail 并单独报告该失败（仍不 fail：守卫本身是诊断品）
          set -o pipefail
          if ! added=$(git diff --numstat "${{ github.event.pull_request.base.sha }}...HEAD" -- backend/app | awk '{s+=$1} END {print s+0}'); then
            echo "::warning::无法计算 backend/app 的改动行（git diff 失败，如 base.sha 不可达）——本轮空转守卫未生效，请人工确认增量门禁是否仍有约束"
            exit 0
          fi
          if [ "${added}" -gt 0 ] && grep -q 'No lines with coverage information' diff-cover.md 2>/dev/null; then
            echo "::warning::本次改动往 backend/app/ 新增了 ${added} 行，但 diff-cover 未测到任何改动行——可能是 coverage.xml↔git 路径映射断裂、增量门禁空转，请人工确认"
          fi

      # 覆盖率摘要进 PR 页（issue #465）——失败/成功后都写，便于对比趋势
      - name: Append coverage summary
        if: always()
        continue-on-error: true  # 诊断品解析失败不染红 job（#414），与同批 artifact/注解口径一致
        working-directory: backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          if not os.path.exists("coverage.xml"):
              print("### 后端覆盖率\n⚠️ 未生成 coverage.xml，无法汇总")
              raise SystemExit(0)
          root = ET.parse("coverage.xml").getroot()
          print("### 后端覆盖率（SQLite 全量，line+branch 合并口径）")
          print(f"- 行覆盖：{float(root.get('line-rate', 0)) * 100:.2f}%")
          print(f"- 分支覆盖：{float(root.get('branch-rate', 0)) * 100:.2f}%")
          print("- 全局阈值 `fail_under` 见 `backend/pyproject.toml`（跌破即红）")
          PY

      - name: Upload coverage report
        if: always()
        continue-on-error: true  # 诊断品上传失败不染红 job（artifact 服务间歇 403，#414）
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
            diff-cover.md
          retention-days: 14

      # 失败用例以 PR 注解标到文件行（issue #465）。annotate_only 只发 workflow
      # command 注解、不建 check run，公共库只读 token 即可用；解析失败/无文件也不
      # 染红 job（#414 诊断品约定 + fail_on_* 全默认 false）。
      - name: Publish test annotations (PR)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: backend/junit.xml
          test_files_prefix: backend/
          annotate_only: true

  # MySQL 门禁：覆盖 SQLite 测不出的方言差异（VARCHAR 长度、DECIMAL 截断、
  # 隐式排序、排序规则等），并验证生产启动顺序（create_all → alembic upgrade head）
  backend-test-mysql:
    name: "Backend Tests (MySQL)"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # 可逆性豁免开关（issue #170）：仅限引入不可逆迁移（如 DROP 列）的 PR 临时置 true，
    # 合入后必须改回 false。放 job 级 env 是为了让下方「残留检查」的 if 能读它
    # （step 级 env 不在 if 的可用上下文里）。
    env:
      SKIP_DOWNGRADE: "false"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 库级字符集与排序规则对齐生产 RDS（utf8mb4 / utf8mb4_general_ci，#433 起统一）。
      # 连接串侧同样是 charset=utf8mb4，两侧一致才不会有「4 字节 UTF-8 字符（emoji、
      # CJK 扩展 B）撞 utf8mb3 列 → errno 1366 → 整条记录写不进去」这个缺陷面：
      # #427 曾在 utf8mb3 库内把五张自由文本表单独提为 utf8mb4 作例外，#433 把库级
      # 一并统一、例外清单随之取消（迁移 0015）。改回 utf8mb3 会让 test_db_charset.py
      # 与 test_migration_0015.py 变红。
      #
      # 注：`CREATE DATABASE` 的库级设置只决定**将来**建表的默认值，不会改动已存在的表；
      # 且新库路径下 `create_all`（main.py import 期）在迁移之前跑，故模型层另有
      # app/models/base.py 的钩子确保每张表自带 CHARSET，不单纯依赖这里。
      #
      # 最小权限测试账号（#539 第二单元）：pytest 会话开头就是一次 drop_all，用 root 连接
      # 等于「URL 一旦被指错，整个实例可毁」。这里按库分设两个账号，root 只留在本步建库建号：
      # ir_test 侧连不到 ir_migration，反之亦然——即使 `tests/db_isolation.py` 的归属闸门
      # 被绕过，DBACL 层也不给跨库权限。权限清单以 `scripts/tests/test_ci_mysql_account.py`
      # 的 REQUIRED_PRIVILEGES 为准（逐条对应真实用法；其中最不容易想到的是 REFERENCES：
      # 建外键需要父表上的该权限，漏了 create_all 当场失败）。口令与用户名同值——这是每次 run
      # 新建、只对 runner 回环暴露的一次性服务容器，不构成秘密（root 口令本就在下面两行）。
      - name: Create databases and least-privilege test accounts
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE DATABASE ir_test CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
            CREATE DATABASE ir_migration CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
            CREATE USER 'ir_test'@'%' IDENTIFIED BY 'ir_test';
            CREATE USER 'ir_migration'@'%' IDENTIFIED BY 'ir_migration';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES
              ON ir_test.* TO 'ir_test'@'%';
            GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, ALTER, INDEX, REFERENCES
              ON ir_migration.* TO 'ir_migration'@'%';"

      # 复刻生产启动顺序：main.py import 期 create_all 建全表，lifespan 内 upgrade head 增量修补
      - name: Verify migration chain (create_all + alembic upgrade head)
        env:
          DATABASE_URL: mysql+pymysql://ir_migration:ir_migration@127.0.0.1:3306/ir_migration?charset=utf8mb4
        run: |
          python -c "from app.database import engine; from app.models.base import Base; import app.models; Base.metadata.create_all(bind=engine)"
          alembic upgrade head
          alembic current | grep "(head)"
          # 可逆性验证：downgrade -1 只回退最新一条迁移（已知不可逆的 0006/0008 不会被触碰）
          if [ "${SKIP_DOWNGRADE}" != "true" ]; then
            alembic downgrade -1
            alembic upgrade head
            alembic current | grep "(head)"
          else
            echo "::warning::SKIP_DOWNGRADE=true，跳过迁移可逆性验证，合入后请移除此豁免"
          fi

      # 逃生阀回收（issue #464）：仅在 main（push）侧拦截残留——PR 侧补录不可逆迁移时
      # 必须能用豁免（且豁免本身就是 PR 期的临时动作），故不在 PR 上失败。
      - name: Guard SKIP_DOWNGRADE residue (main only)
        if: always() && github.event_name == 'push' && env.SKIP_DOWNGRADE != 'false'
        run: |
          echo "::error::main 上 SKIP_DOWNGRADE=${SKIP_DOWNGRADE} 残留：迁移降级验证被跳过，请改回 false"
          exit 1

      - name: Run tests with pytest (MySQL)
        env:
          TEST_DB_URL: mysql+pymysql://ir_test:ir_test@127.0.0.1:3306/ir_test?charset=utf8mb4
        run: |
          pytest tests/ -q --tb=short --strict-markers

  # CLI 契约防漂移校验（issue #170 扩展）、scripts 单测（#462 由独立 micro job 并入）：
  #   1. openapi.json 漂移门禁——隔离子进程生成 schema 与已提交契约比对
  #   2. ir-cli 响应字段契约校验
  #   3. ir-cli 单元测试
  #   4. scripts/tests 单测（scripts/ 不在 --cov=app 覆盖率口径内，故与 ir-cli 同处
  #      无覆盖率的轻量 job；原样保留从仓库根跑的调用方式）
  # 触发面 = ir-cli / backend / scripts 任一（openapi 漂移门禁依赖 backend 应用）。
  cli-contract-check:
    name: "CLI Contract Check"
    needs: changes
    if: >-
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # openapi.json 漂移门禁：改 router/schema 忘记重新导出时 exit 1
      # （隔离子进程在独立临时 SQLite 内执行 create_all + init_scheduled_tasks，不继承业务配置）
      - name: Check openapi.json drift
        run: python backend/check_openapi.py

      # 不一致时 exit 1：请运行 `python ir-cli/scripts/gen_response_fields.py` 重新生成并提交
      - name: Check response fields contract
        run: |
          python ir-cli/scripts/gen_response_fields.py --check

      - name: Install ir-cli and run unit tests
        run: |
          pip install -e ir-cli pytest
          pytest ir-cli/tests -q

      # scripts/ 与 scripts/tests/ 保持 stdlib-only（+ pytest）：原 scripts-test
      # micro job 只装 pytest，该约束是环境强制的；#462 并入本 job 后环境里有
      # backend requirements 与 ir-cli，误引入第三方 import 不会再被发现——
      # 故把约定写在这里（新增第三方依赖前请先改这条注释并说明理由）。
      - name: Run scripts tests
        run: python -m pytest scripts/tests -q

  # 前端门禁：前端已容器化部署，类型/语法错误与构建失败必须在 CI 拦住
  # （历史上因无前端门禁漏过任务页 map 崩溃等问题）
  frontend-check:
    name: "Frontend Lint & Build"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # fetch-depth 0：diff-cover 需要 PR base.sha 可达（默认浅克隆只有 head）
          fetch-depth: 0

      # Node 版本与 frontend/Dockerfile、frontend/.nvmrc 保持一致
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npx tsc --noEmit

      # 单元测试（issue #253）：lib 纯逻辑层快速拦截，置于耗时的 build 之前。
      # issue #464 起带 --coverage（阈值见 vitest.config.ts，未达标即 exit 1）。
      - name: Unit tests
        run: npm run test

      # 增量覆盖率门禁（issue #485）：只约束本 PR 在 src/lib/** 的改动行，堵住
      # 「新模块 0% 覆盖被既有高覆盖稀释通过」的前端侧缺口，形态与 backend-test 的
      # diff-cover 步骤一致（阈值 80；该步也有 fetch-depth 0 与空转守卫）。
      # 数据源 = vitest 的 lcovonly reporter（coverage/lcov.info；其 projectRoot 置
      # 仓库根，SF 为 frontend/src/... 相对路径，保证 diff-cover 能按 git root 归因，
      # 见 frontend/vitest.config.ts）；components/hooks/lib-api 等不在分母内的路径
      # 无覆盖率数据、不算改动行（与后端只约束 backend/app 同形）。
      # 只在 PR 事件生效；main 侧由全局 thresholds 兜底。
      - name: Setup Python 3.12 (diff-cover)
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 版本与 backend/requirements.txt 对齐（同一把尺）；改版本时两边同步
      - name: Install diff-cover
        if: github.event_name == 'pull_request'
        run: python -m pip install --quiet diff-cover==10.5.1

      # 数据源完整性断言（#485 评审）：lcov 缺失/为空、或 SF 不是仓库根相对路径时，
      # diff-cover 会输出「No lines with coverage information」并 exit 0——门禁静默
      # 空转，而其守卫只会发 warning。这里把「门禁失去数据源」直接变红（fail-closed），
      # 与下方守卫的分工：守卫管「本 PR 改动行的归因」，本步管「数据源本身可用」。
      # SF 断言只按前缀（frontend/）而非具体分母路径写，避免与 coverage.include 的
      # 后续调整（如 #505）耦合。
      - name: Assert lcov data source (PR)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          test -s frontend/coverage/lcov.info \
            || { echo "::error::frontend/coverage/lcov.info 缺失或为空，增量门禁会静默空转"; exit 1; }
          grep -q '^SF:frontend/' frontend/coverage/lcov.info \
            || { echo "::error::lcov 的 SF 不是仓库根相对路径（frontend/...），增量门禁会静默空转；复核 vitest.config.ts 的 lcovonly projectRoot 与运行 cwd"; exit 1; }

      - name: Diff coverage gate (PR changed lines)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          diff-cover frontend/coverage/lcov.info \
            --compare-branch=${{ github.event.pull_request.base.sha }} \
            --fail-under=80 --format markdown:diff-cover.md

      - name: Append diff coverage summary
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        run: cat diff-cover.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # 门禁退化可见化（沿用 backend-test 的口径）：lcov.info↔git 的路径映射若断裂，
      # diff-cover 会输出「No lines with coverage information」并 exit 0——门禁静默
      # 空转（改动行一行没被约束而 CI 全绿）。
      # scope 必须与覆盖率口径同源（frontend/vitest.config.ts 的 include∖exclude）：
      # 排除 src/lib/api/**（有意不计分母）与 colocated 测试文件，否则「只改 api/测试」
      # 这类常规 PR 会命中「有新增行 + 无覆盖率数据」而发假告警，把本就微弱的 warning
      # 通道噪声化。改 include/exclude 时必须同步改这里。
      - name: Warn on unmapped diff (PR)
        if: always() && github.event_name == 'pull_request'
        working-directory: .
        run: |
          # 默认 shell 是 `bash -e {0}`（无 pipefail），git diff 失败会被 awk 吞成 added=0
          # 而静默跳过告警——显式开 pipefail 并单独报告该失败（仍不 fail：守卫本身是诊断品）
          set -o pipefail
          if ! added=$(git diff --numstat "${{ github.event.pull_request.base.sha }}...HEAD" \
              -- frontend/src/lib ':(exclude)frontend/src/lib/api' \
                 ':(exclude)frontend/src/lib/*.test.ts' ':(exclude)frontend/src/lib/*.test.tsx' \
              | awk '{s+=$1} END {print s+0}'); then
            echo "::warning::无法计算 frontend/src/lib 的改动行（git diff 失败，如 base.sha 不可达）——本轮空转守卫未生效，请人工确认增量门禁是否仍有约束"
            exit 0
          fi
          if [ "${added}" -gt 0 ] && grep -q 'No lines with coverage information' diff-cover.md 2>/dev/null; then
            echo "::warning::本次改动往 frontend/src/lib/ 新增了 ${added} 行（口径内源文件），但 diff-cover 未测到任何改动行——可能是 lcov.info↔git 路径映射断裂、增量门禁空转，请人工确认"
          fi

      # 覆盖率摘要进 PR 页（issue #465）；tests 失败时也写，便于看是阈值还是断言红
      - name: Append coverage summary
        if: always()
        continue-on-error: true  # 诊断品解析失败不染红 job（#414），与同批 artifact/注解口径一致
        working-directory: frontend
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const p = "coverage/coverage-summary.json";
          if (!fs.existsSync(p)) {
            console.log("### 前端覆盖率\n⚠️ 未生成覆盖率报告（单测未跑到产出阶段）");
            process.exit(0);
          }
          const t = JSON.parse(fs.readFileSync(p, "utf8")).total;
          console.log("### 前端覆盖率（src/lib 纯逻辑层，src/lib/api 薄封装不计入）");
          console.log(`- 行覆盖：${t.lines.pct}%（${t.lines.covered}/${t.lines.total}）`);
          console.log(`- 分支覆盖：${t.branches.pct}%`);
          console.log(`- 函数覆盖：${t.functions.pct}%`);
          console.log("- 阈值见 `frontend/vitest.config.ts`（未达标时上一步已红）");
          JS

      - name: Upload frontend coverage report
        if: always()
        continue-on-error: true  # 诊断品上传失败不染红 job（#414）
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
            frontend/junit.xml
            diff-cover.md
          retention-days: 14

      # 失败用例以 PR 注解标到文件行（issue #465），同 backend-test 的处置
      - name: Publish test annotations (PR)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: frontend/junit.xml
          test_files_prefix: frontend/
          annotate_only: true

      # next build 内部也会跑 lint + tsc，但单独前置两步能更快定位失败原因
      - name: Next.js build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # 前端 E2E 门禁（issue #168）：真实浏览器验证登录/页面渲染/防 P0 复发，
  # 拦截"接口正确但用户用不了"的问题（白屏崩溃、死链、双导航等）。
  # 后端跑在 MySQL 8.4 上（对齐 backend-test-mysql 的"对齐生产 RDS"哲学）。
  # 栈步骤已抽到 .github/workflows/e2e-stack.yml（issue #467），本 job 只保留触发条件与入参。
  #
  # 运行前提（勿删）：
  #   - E2E 登录用例依赖 ADMIN/admin@2026 用户，业务 spec 经 e2e/helpers.ts 按 code
  #     直达两个种子组合：draft E2E_PORT（表单交互/首购激活）+ active E2E_ACTIVE
  #     （#354：快照/持仓/编辑交易，消除旧「无组合即静默全 skip、覆盖蒸发」），
  #     均由 scripts/seed_e2e.py 种子产生（种子体与 pytest 同源：tests/seed_base.py），
  #     删除 seed 步骤登录必挂、业务 spec 因缺组合硬失败
  #   - 前端 next.config.js 将 /api/* rewrite 到 localhost:8000，故需真实后端
  frontend-e2e:
    name: "Frontend E2E"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/e2e-stack.yml
    with:
      mode: main
      artifact_prefix: playwright-report
      retries: "2"
      log_file: backend-e2e.log

  # Dockerfile 构建冒烟（issue #170）：每个 PR 验证两个 Dockerfile 可构建，
  # 避免「构建问题合入 main 触发 CD 才暴露」（#141 ACR 拒推 provenance 即此类）。
  # 与 deploy.yml 共用 gha 缓存 scope（相互预热）；push: false 不产生 ACR tag。
  docker-build-smoke:
    name: "Docker Build Smoke (${{ matrix.service }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            # rewrites 在 build 时固化，与 deploy.yml 保持一致
            build_args: |
              API_BASE_URL=http://backend:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build_args }}
          tags: investring-${{ matrix.service }}:smoke
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # 与 deploy.yml 一致：ACR 个人版不支持 OCI attestation（issue #141）
          provenance: false
          sbom: false

  # 变更路径检测（issue #462 起同时服务 job 裁剪与 E2E 形态对比触发）。
  # 本 job **全事件运行**：若只在 PR 侧运行，push 时它被 skip，各 job 因
  # `needs` 命中 skip 而整体跳过（即使写了 `if: github.event_name == 'push'`——
  # GitHub 会把默认的 success() 与 if 相与，skipped 依赖使 success() 为假），
  # 于是合入 main 后一个实质测试都不跑而 CD 照常部署。
  # 非 PR 事件输出保守全量，e2e_morph 除外（compare 只是 PR 侧防线，详见 detect 步骤注释）。
  changes:
    name: "Detect Changed Paths"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      cli: ${{ steps.detect.outputs.cli }}
      scripts: ${{ steps.detect.outputs.scripts }}
      e2e_morph: ${{ steps.detect.outputs.e2e_morph }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # PR 侧检出头 commit（fetch-depth 0 供 base...HEAD diff）；
          # push / workflow_dispatch 侧 head.sha 为空，回落 github.sha
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check context documentation
        run: python3 scripts/check_context_docs.py

      # 纯 git 检测（不引第三方 action）。
      # 非 PR 事件（push / workflow_dispatch）一律保守「全量」：main 必须完整验证；
      # 但 e2e_morph 恒 false——compare 只拦 PR 侧的「测试重构假绿灯」，
      # 置 true 会让每次合入 main 多跑两轮全量 E2E。
      # 裁剪取舍与「为何不做 nightly 定时体检」的完整论证见 #482（决策记录）。
      # PR 侧路径映射（改映射必须重新审视下方注释里的既有依赖）：
      #   backend   ← backend/ 或 docs/（test_error_codes_doc_sync.py 以
      #               docs/reference/business-constraints.md 为断言输入）
      #   frontend  ← frontend/ 或 E2E 种子文件（种子破坏必须让 frontend-e2e 真红：
      #               compare 对两侧同形失败会判空 diff，兜不住）
      #   cli       ← ir-cli/（openapi 漂移门禁另依赖 backend，条件里已 OR）
      #   scripts   ← scripts/
      #   .github/workflows/ 命中则**四个栈全 true**：CI 配置改动无法预判影响面，
      #               而改配置的 PR 正是最需要完整验证的场合（代价 = 回到裁剪前的全量）。
      #               四个栈不含 e2e_morph——形态强制位对它无效（emit 传 nowf，见下条）。
      #   e2e_morph ← 形态输入清单：e2e 目录、playwright 配置、种子与 normalizer
      #               （它们同样改变 pass/skip 形态）。
      #               **刻意不含 .github/workflows/**（#467）**：原先把 ci.yml 自身列入
      #               是 dogfood，代价是任何 ci.yml 改动（哪怕只改注释）都触发
      #               baseline+candidate 两轮全量 E2E；CI 配置改动已由上面的
      #               「四栈全 true」覆盖，形态对比不必再跑一遍。e2e-stack.yml 同理
      #               不入列——把同一问题搬到新文件没有收益；栈的 main 模式由
      #               frontend-e2e 正面验证，但 **capture 分支不因只改 workflow 而实跑**
      #               （缺口与手动确认口径见 e2e-stack.yml 头部）。
      - id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "cli=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            echo "e2e_morph=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" > /tmp/changed.txt
          hit() { grep -qE "$1" /tmp/changed.txt && echo true || echo false; }
          wf=$(hit '^\.github/workflows/')
          emit() {  # $1=输出名 $2=该栈是否命中 $3=nowf（不吃 workflow 全局强制，仅 e2e_morph）
            if [ "$2" = "true" ] || { [ "${3:-}" != "nowf" ] && [ "$wf" = "true" ]; }; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          emit backend "$(hit '^(backend/|docs/)')"
          emit frontend "$(hit '^(frontend/|backend/tests/seed_base\.py$|backend/scripts/seed_e2e\.py$)')"
          emit cli "$(hit '^ir-cli/')"
          emit scripts "$(hit '^scripts/')"
          emit e2e_morph "$(hit '^(frontend/e2e/|frontend/playwright\.config\.ts|backend/tests/seed_base\.py|backend/scripts/seed_e2e\.py|scripts/e2e_normalize\.py|scripts/tests/)')" nowf
          # 输出缺失/写错会让所有 job 静默 skip 而 `CI OK` 仍绿（= 假绿），显式校验
          for k in backend frontend cli scripts e2e_morph; do
            n=$(grep -cE "^$k=(true|false)$" "$GITHUB_OUTPUT" || true)
            if [ "$n" != "1" ]; then
              echo "::error::changes 输出 $k 异常（期望 1 条 true/false，实得 $n 条）"
              exit 1
            fi
          done

  # E2E 形态对比（issue #410）：纯测试重构 PR 的「假绿灯」防线——base 与 PR 两侧
  # 各跑一遍全量 E2E，归一化（scripts/e2e_normalize.py）成 TSV 后 diff，期望空 diff；
  # 非空 diff 拦合入，预期形态变化（增删用例/调整 skip）的 PR 打 e2e-morph-expected
  # 标签豁免。两侧构建源同为 PR head，唯一变量是 frontend/e2e/ 目录；栈步骤已抽到
  # .github/workflows/e2e-stack.yml（issue #467），baseline 换目录在 called workflow 内完成。
  e2e-compare-capture:
    name: "E2E Capture (${{ matrix.side }})"
    needs: changes
    if: needs.changes.outputs.e2e_morph == 'true'
    strategy:
      fail-fast: false  # 一侧挂了另一侧仍跑完留证
      matrix:
        side: [baseline, candidate]
    uses: ./.github/workflows/e2e-stack.yml
    with:
      mode: capture
      side: ${{ matrix.side }}
      artifact_prefix: e2e-raw-${{ matrix.side }}
      retries: "0"
      log_file: backend-e2e-compare.log

  e2e-compare:
    name: "E2E Morphology Compare"
    needs: e2e-compare-capture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 默认 checkout PR merge commit：用 PR 版 normalizer 处理两侧 raw，自洽
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download raw JSON
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-raw-*
          path: /tmp/raw

      - name: Normalize both sides
        run: |
          python3 scripts/e2e_normalize.py \
            --input /tmp/raw/e2e-raw-baseline/e2e-raw-baseline.json \
            --output /tmp/base.tsv --projects chromium,mobile --side baseline
          python3 scripts/e2e_normalize.py \
            --input /tmp/raw/e2e-raw-candidate/e2e-raw-candidate.json \
            --output /tmp/cand.tsv --projects chromium,mobile --side candidate

      # diff 退出码显式捕获，不依赖 shell 的 pipefail 默认值
      - name: Diff morphology
        env:
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-morph-expected') }}
        run: |
          rc=0
          diff /tmp/base.tsv /tmp/cand.tsv > /tmp/morph.diff || rc=$?
          cat /tmp/morph.diff
          if [ "$rc" -eq 0 ]; then echo "✅ 形态一致（空 diff）"; exit 0; fi
          {
            echo '### E2E 形态 diff'
            echo '```diff'
            cat /tmp/morph.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXEMPT" = "true" ]; then
            echo "::warning::形态有差异，经 e2e-morph-expected 标签放行"
            exit 0
          fi
          echo "::error::E2E 形态非预期变化；若属预期（增删用例/调整 skip），请给 PR 加 e2e-morph-expected 标签（labeled 触发重跑）"
          exit 1

  # 汇总门禁（issue #211）：作为 main 分支唯一的 required status check。
  # 不直接把 matrix 展开的 Docker Build Smoke / 偏发的 Frontend E2E 设为 required，
  # 而是用本 job needs 全部实质 job 后统一判定——任一 failure/cancelled 即失败，
  # skipped 视为通过（路径裁剪后未触达的 job 与 compare 系在非 e2e PR 下跳过，issue #410/#462）。
  ci-ok:
    name: "CI OK"
    if: always()
    needs:
      - backend-test
      - backend-test-mysql
      - cli-contract-check
      - frontend-check
      - frontend-e2e
      - docker-build-smoke
      - changes
      - e2e-compare-capture
      - e2e-compare
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "needs results: $results"
          case "$results" in
            *failure*|*cancelled*)
              echo "❌ CI 未全绿（存在 failure/cancelled）"
              exit 1
              ;;
          esac
          echo "✅ 全部必需 job 成功"
